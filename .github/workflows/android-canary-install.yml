name: Install Android Canary (manual gway-001)

# Installation is never triggered by a pull request, push, release or CI run.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number that produced the reviewed APK"
        type: string
        required: true
      expected_sha:
        description: "Exact 40-character source commit"
        type: string
        required: true
      artifact_run_id:
        description: "Successful Android Canary APK workflow run ID"
        type: string
        required: true
      apk_sha256:
        description: "Previously verified 64-character APK digest"
        type: string
        required: true
      canary_reset:
        description: "Allow deleting ONLY the isolated canary's local data after a signing conflict"
        type: choice
        options:
          - "no"
          - "RESET_CANARY_ONLY"
        default: "no"
        required: true
      run_compose_tests:
        description: "Run paired hermetic Compose tests on the USB canary after installation"
        type: choice
        options:
          - "no"
          - "RUN_HERMETIC_TESTS"
        default: "no"
        required: true

      compose_suite:
        description: "Allowlisted hermetic Compose test suite"
        type: choice
        options:
          - baseline
          - quotations
          - opportunities
        default: baseline
        required: true

      authorization_run_id:
        description: "Trusted owner-dispatched acceptance run ID (automation only)"
        type: string
        default: ""
      run_feed_tests:
        description: "Run isolated Feed TLS and Compose acceptance (PR #706; dedicated volumes required)"
        type: choice
        options:
          - "no"
          - "RUN_ISOLATED_FEED"
        default: "no"
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: gway-001-android-canary-install
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          AUTH: ${{ inputs.authorization_run_id }}
          PR: ${{ inputs.pr_number }}
          SHA: ${{ inputs.expected_sha }}
          RESET: ${{ inputs.canary_reset }}
          MODE: ${{ inputs.run_compose_tests }}
          SUITE: ${{ inputs.compose_suite }}
          FEED: ${{ inputs.run_feed_tests }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_ACTOR" == arthexis && -z "$AUTH" ]]; then exit 0; fi
          [[ "$GITHUB_ACTOR" == 'github-actions[bot]' && "$AUTH" =~ ^[1-9][0-9]{0,11}$ && "$MODE" == RUN_HERMETIC_TESTS && "$SUITE" == baseline && "$FEED" == no ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTH" | python3 -c 'import json,os,sys; r=json.load(sys.stdin); e=os.environ; assert r["path"]==".github/workflows/android-acceptance.yml" and r["event"]=="workflow_dispatch" and r["head_branch"]=="main" and r["actor"]["login"]=="arthexis" and r["triggering_actor"]["login"]=="arthexis" and r["status"]=="in_progress" and r["display_title"]=="Android acceptance accept PR #"+e["PR"]+" SHA "+e["SHA"]+" reset "+e["RESET"]'
  install:
    needs: authorize
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (github.actor == 'arthexis' || github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable source and source workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FEED_MODE: ${{ inputs.run_feed_tests }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
          EXPECTED_DIGEST: ${{ inputs.apk_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$ARTIFACT_RUN" =~ ^[1-9][0-9]{0,11}$ ]] || exit 1
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          if [[ "${{ inputs.run_feed_tests }}" == "RUN_ISOLATED_FEED" ]]; then
            [[ "$PR_NUMBER" == "706" && "${{ inputs.canary_reset }}" == "no" &&
               "${{ inputs.run_compose_tests }}" == "no" ]] || {
              echo "::error::Feed mode requires PR 706, no reset, no other suite"; exit 1;
            }
          fi
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          printf '%s' "$PR" | python3 -c 'import json, os, sys; p=json.load(sys.stdin); assert (p["state"] == "open" or (os.environ["FEED_MODE"] == "RUN_ISOLATED_FEED" and p["state"] == "closed" and p["merged"] is True)) and p["head"]["repo"]["full_name"] == os.environ["GITHUB_REPOSITORY"] and p["head"]["sha"] == os.environ["EXPECTED_SHA"], "PR identity mismatch"'
          SOURCE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN")
          printf '%s' "$SOURCE_RUN" | python3 -c 'import json, sys; r=json.load(sys.stdin); assert r["name"] == "Android Canary APK (manual)" and r["path"] == ".github/workflows/android-canary.yml" and r["event"] == "workflow_dispatch" and r["head_branch"] == "main" and r["conclusion"] == "success", "Source workflow mismatch"'
          ARTIFACT="android-canary-pr$PR_NUMBER-$(printf '%s' "$EXPECTED_SHA" | cut -c1-12)"
          DEST="$RUNNER_TEMP/android-canary-install-$GITHUB_RUN_ID"
          mkdir -m 700 "$DEST"
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$DEST"
          test -f "$DEST/gway-remote-canary.apk"
          test -f "$DEST/SHA256SUMS"
          test -f "$DEST/PROVENANCE.txt"
          [[ ! -L "$DEST/gway-remote-canary.apk" ]] || exit 1
          [[ "$(stat -c '%s' "$DEST/gway-remote-canary.apk")" -gt 10000 ]] || exit 1
          [[ "$(stat -c '%s' "$DEST/gway-remote-canary.apk")" -lt 104857600 ]] || exit 1
          (cd "$DEST" && sha256sum --check SHA256SUMS)
          [[ "$(sha256sum "$DEST/gway-remote-canary.apk" | cut -d' ' -f1)" == "$EXPECTED_DIGEST" ]] || exit 1
          grep -Fxq "Repository: $GITHUB_REPOSITORY" "$DEST/PROVENANCE.txt"
          grep -Fxq "Pull-Request: $PR_NUMBER" "$DEST/PROVENANCE.txt"
          grep -Fxq "Source-Commit: $EXPECTED_SHA" "$DEST/PROVENANCE.txt"
          grep -Fxq "Package: com.arthexis.gwayremote.canary" "$DEST/PROVENANCE.txt"
          grep -Fxq "Canary-Overlay: package-and-label-v1" "$DEST/PROVENANCE.txt"
          grep -Fxq "Actions-Run: $ARTIFACT_RUN" "$DEST/PROVENANCE.txt"
          echo "CANARY_APK=$DEST/gway-remote-canary.apk" >> "$GITHUB_ENV"
          echo "CANARY_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "CANARY_DIGEST=$EXPECTED_DIGEST" >> "$GITHUB_ENV"
          echo "Verified pinned APK and provenance for PR #$PR_NUMBER"

      - name: Install ONLY isolated canary on one authorized USB Android
        if: ${{ inputs.run_feed_tests == 'no' && inputs.run_compose_tests == 'no' }}
        shell: bash
        env:
          CANARY_RESET: ${{ inputs.canary_reset }}
        run: |
          set -euo pipefail
          case "$CANARY_RESET" in
            no) python3 -m gway_remote.android_canary_install --apk "$CANARY_APK" ;;
            RESET_CANARY_ONLY)
              # Explicit, per-run opt-in. May discard ONLY canary-local data.
              python3 -m gway_remote.android_canary_install --apk "$CANARY_APK" --reset-canary ;;
            *) echo "::error::Unexpected canary reset selection"; exit 1 ;;
          esac
          echo "### Canary installed on gway-001 USB Android" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: com.arthexis.gwayremote.canary" >> "$GITHUB_STEP_SUMMARY"
          echo "PR source SHA: $CANARY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA256: $CANARY_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Production package path verified unchanged; no app launch or UI actions." >> "$GITHUB_STEP_SUMMARY"

      - name: Run pinned hermetic Compose tests on isolated USB canary
        if: ${{ inputs.run_feed_tests == 'no' && inputs.run_compose_tests == 'RUN_HERMETIC_TESTS' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
          CANARY_RESET: ${{ inputs.canary_reset }}
          COMPOSE_SUITE: ${{ inputs.compose_suite }}
        run: |
          set -euo pipefail
          # Default preserves canary data; only the explicit reset selection
          # permits package replacement after a recognized signature conflict.
          case "$COMPOSE_SUITE" in baseline|quotations|opportunities) ;; *) exit 1 ;; esac
          case "$CANARY_RESET" in
            no) RESULT=$(python3 -m gway_remote.android_canary_field --pr "$PR_NUMBER" --install --wake --expected-run "$ARTIFACT_RUN" --suite "$COMPOSE_SUITE") ;;
            RESET_CANARY_ONLY) RESULT=$(python3 -m gway_remote.android_canary_field --pr "$PR_NUMBER" --install --allow-canary-reset --wake --expected-run "$ARTIFACT_RUN" --suite "$COMPOSE_SUITE") ;;
            *) exit 1 ;;
          esac
          COUNT=$(printf '%s' "$RESULT" | python3 -c 'import json, os, sys; r=json.load(sys.stdin); assert r.get("status") == "passed" and r.get("source_sha") == os.environ["EXPECTED_SHA"] and str(r.get("run_id")) == os.environ["ARTIFACT_RUN"] and r.get("pr") == int(os.environ["PR_NUMBER"]), "Canary field receipt not accepted"; n=r.get("tests_passed"); assert r.get("suite") == os.environ["COMPOSE_SUITE"], "Unexpected test suite"; assert type(n) is int and n >= {"baseline": 6, "quotations": 5, "opportunities": 2}[os.environ["COMPOSE_SUITE"]], "Compose suite incomplete"; print(n)')
          mkdir -m 700 "$RUNNER_TEMP/android-physical-receipt-$GITHUB_RUN_ID"
          printf '%s' "$RESULT" | python3 -c 'import json,os,sys; r=json.load(sys.stdin); assert r["production_package_unchanged"] is True; r["install_run_id"]=int(os.environ["GITHUB_RUN_ID"]); print(json.dumps(r))' > "$RUNNER_TEMP/android-physical-receipt-$GITHUB_RUN_ID/receipt.json"
          echo "### Physical Compose acceptance on gway-001" >> "$GITHUB_STEP_SUMMARY"
          echo "Source PR: #$PR_NUMBER; revision: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Suite: $COMPOSE_SUITE" >> "$GITHUB_STEP_SUMMARY"
          echo "Hermetic Compose tests passed: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "Scope: canary and canary.test only; not a full screen-by-screen visual audit." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized physical acceptance receipt
        if: inputs.run_feed_tests == 'no' && inputs.run_compose_tests == 'RUN_HERMETIC_TESTS'
        uses: actions/upload-artifact@v4
        with:
          name: android-physical-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/android-physical-receipt-${{ github.run_id }}/receipt.json
          if-no-files-found: error
          retention-days: 14
      # This mode executes reviewed main code only, never a PR checkout on
      # the physical self-hosted node. Existing actor/ref/concurrency gates
      # apply. No sudo, mount creation, production deploy or auto-reset.
      - name: Run isolated Feed TLS and Compose acceptance
        if: inputs.run_feed_tests == 'RUN_ISOLATED_FEED'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$(hostname -s)" == "gway-001" ]] || exit 1
          RESULT=$(python3 -m gway_remote.android_feed_canary --pr "$PR_NUMBER" --sha "$EXPECTED_SHA" --run-id "$ARTIFACT_RUN" --artifact-dir "$(dirname "$CANARY_APK")")
          printf '%s' "$RESULT" | python3 -c 'import json,os,sys; r=json.load(sys.stdin); assert r["status"]=="passed" and r["source_sha"]==os.environ["EXPECTED_SHA"] and str(r["run_id"])==os.environ["ARTIFACT_RUN"] and r["android_tls"]=="verified" and r["compose_tests_passed"]==1 and r["temporary_session"]=="removed" and r["production_package_unchanged"] is True'
          echo "Feed TLS and Compose verified; temporary session removed; canary APK retained." >> "$GITHUB_STEP_SUMMARY"
