name: Android Compose UI Tests

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-compose-ui.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-compose-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [phone, narrow, tablet, large-text]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::/dev/kvm is unavailable on this runner"
            ls -l /dev/kvm || true
            exit 1
          fi
          if [[ ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm is not writable"
            ls -l /dev/kvm
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/scripts/run-compose-ui-tests.sh "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-ui-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android/build/compose-ui-diagnostics/
          if-no-files-found: warn
