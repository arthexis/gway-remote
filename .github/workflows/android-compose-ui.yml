name: Android Compose UI Tests

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Android UI configuration
        type: choice
        options:
          - phone
          - narrow
          - tablet
          - large-text
        default: phone
        required: true

permissions:
  contents: read

jobs:
  compose-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/scripts/run-compose-ui-tests.sh "${{ inputs.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-ui-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android/build/compose-ui-diagnostics/
          if-no-files-found: warn
