name: Android release candidate (authenticated acceptance)
on:
  workflow_dispatch:
    inputs:
      scope:
        required: true
        type: choice
        options: [smoke, full]
        default: smoke
      ci_run:
        required: false
        type: string
        default: ""
      compose_run:
        required: false
        type: string
        default: ""
      revision_ci_run:
        required: false
        type: string
        default: ""
      backend_run:
        required: false
        type: string
        default: ""
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string
      version_code:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: gway-001-android-canary-install
  cancel-in-progress: false
jobs:
  physical:
    if: github.repository == 'arthexis/gway-remote' && github.ref == 'refs/heads/main' && github.actor == 'arthexis' && github.triggering_actor == 'arthexis'
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact installed candidate using reviewed read-only UI probes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION_CI_RUN: ${{ inputs.revision_ci_run }}
          BACKEND_RUN: ${{ inputs.backend_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          VERSION: ${{ inputs.version_code }}
          SCOPE: ${{ inputs.scope }}
          CI_RUN: ${{ inputs.ci_run }}
          COMPOSE_RUN: ${{ inputs.compose_run }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$(hostname -s)" == gway-001 && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[1-9][0-9]{0,9}$ ]]
          STATE="$HOME/.local/state/gway-android-rc"
          [[ -d "$STATE" && ! -L "$STATE" && "$(stat -c '%a:%U' "$STATE")" == "700:$(id -un)" ]]
          case "$SCOPE" in
            smoke)
              [[ -z "$CI_RUN" && -z "$COMPOSE_RUN" ]]
              args=(execute)
              ;;
            full)
              [[ "$CI_RUN" =~ ^[1-9][0-9]{0,19}$ && "$COMPOSE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
              args=(--ci-run "$CI_RUN" --compose-run "$COMPOSE_RUN" execute-full)
              ;;
            *) exit 1 ;;
          esac
          if [[ -n "$REVISION_CI_RUN" || -n "$BACKEND_RUN" ]]; then
            [[ "$SCOPE" == full && "$REVISION_CI_RUN" =~ ^[1-9][0-9]{0,19}$ && "$BACKEND_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
            args=(--revision "$GITHUB_SHA" --revision-ci-run "$REVISION_CI_RUN" --backend-run "$BACKEND_RUN" "${args[@]}")
          else
            [[ "$SOURCE_SHA" == "$GITHUB_SHA" && "$(git rev-parse HEAD^{tree})" == "$SOURCE_TREE" ]]
          fi
          mkdir -m 700 "$RUNNER_TEMP/rc-accept-$GITHUB_RUN_ID"
          python3 -B -m gway_remote.android_rc_acceptance --ledger "$STATE/ledger.sqlite" \
            --sha "$SOURCE_SHA" --tree "$SOURCE_TREE" --version "$VERSION" \
            --run-id "$GITHUB_RUN_ID" "${args[@]}" > "$RUNNER_TEMP/rc-accept-$GITHUB_RUN_ID/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: android-rc-${{ inputs.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rc-accept-${{ github.run_id }}/receipt.json
          if-no-files-found: error
          retention-days: 30
