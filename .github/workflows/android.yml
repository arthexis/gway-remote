name: Android APK
# ANDROID_PUBLICATION_HOLD_718: preserve the staged CRM rollout.
# LEGACY_ANDROID_PUBLISHER_RETIRED: use exact-artifact promotion only.
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', '.github/workflows/android-compose-ui.yml']
  push:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Deprecated legacy dispatch input; no publication job"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('android-pr-{0}', github.event.pull_request.number) || 'android-publish-main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GWAY_ANDROID_VERSION_CODE: ${{ github.run_number }}
      GWAY_ANDROID_VERSION_NAME: 0.2.${{ github.run_number }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::Preinstalled sdkmanager not found"; exit 1; }
          echo "Using preinstalled sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          for component in "platforms/android-35/android.jar" "build-tools/35.0.0/apksigner" "platform-tools/adb"; do
            if [[ ! -e "$SDK_ROOT/$component" ]]; then
              echo "::error::Required Android SDK component missing: $component"
              exit 1
            fi
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate Android unit tests (PR)
        if: github.event_name == 'pull_request'
        run: |
          start=$SECONDS
          gradle :app:testDebugUnitTest :app:assembleDebugAndroidTest --no-daemon
          echo "Android PR unit tests: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
