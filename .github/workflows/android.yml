name: Android APK
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gway-remote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Require release signing secrets
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE: ${{ secrets.GWAY_APK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GWAY_APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GWAY_APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GWAY_APK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/gway-release.jks"
          chmod 600 "$RUNNER_TEMP/gway-release.jks"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GWAY_APK_KEYSTORE: ${{ runner.temp }}/gway-release.jks
          GWAY_APK_STORE_PASSWORD: ${{ secrets.GWAY_APK_STORE_PASSWORD }}
          GWAY_APK_KEY_ALIAS: ${{ secrets.GWAY_APK_KEY_ALIAS }}
          GWAY_APK_KEY_PASSWORD: ${{ secrets.GWAY_APK_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gway-remote.apk"
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/gway-remote.apk" --title "GWay Remote $GITHUB_REF_NAME" --generate-notes
