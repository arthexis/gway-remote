name: Appliance Deploy
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - ocpp-csms
          - ocpp-simulator
          - gway-lcd-sound
          - gway-agent-ops
          - gway-ap-kiosk

permissions:
  contents: read

concurrency:
  group: gway-001-appliance
  cancel-in-progress: false

jobs:
  ocpp_csms:
    name: Deploy ocpp-csms
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'ocpp-csms') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy ocpp-csms
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target ocpp-csms

  ocpp_simulator:
    name: Deploy ocpp-simulator
    needs: ocpp_csms
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'ocpp-simulator') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy ocpp-simulator
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target ocpp-simulator

  gway_lcd_sound:
    name: Deploy gway-lcd-sound
    needs: ocpp_simulator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-lcd-sound') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy gway-lcd-sound
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-lcd-sound

  gway_agent_ops:
    name: Deploy gway-agent-ops
    needs: gway_lcd_sound
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-agent-ops') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy gway-agent-ops
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-agent-ops

  gway_ap_kiosk:
    name: Deploy gway-ap-kiosk
    needs: gway_agent_ops
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-ap-kiosk') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy gway-ap-kiosk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-ap-kiosk

  report:
    name: Export appliance deployment report
    needs: [ocpp_csms, ocpp_simulator, gway_lcd_sound, gway_agent_ops, gway_ap_kiosk]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export read-only sanitized report
        shell: bash
        run: |
          set -euo pipefail
          python3 -m gway_remote report-bundle --output "$RUNNER_TEMP/gway-remote-report"
          cat "$RUNNER_TEMP/gway-remote-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and bounded sanitized logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gway-001-deploy-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gway-remote-report/
          retention-days: 14
          if-no-files-found: error
