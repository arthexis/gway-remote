name: Appliance Deploy
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - ocpp-csms
          - ocpp-reports
          - ocpp-simulator
          - gway-lcd-sound
          - gway-agent-ops
          - gway-ap-kiosk
          - gway-rfid
          - gway-bastion

permissions:
  contents: read
  issues: write

concurrency:
  group: gway-001-appliance
  cancel-in-progress: false

jobs:
  ocpp_csms:
    name: Deploy ocpp-csms
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'ocpp-csms') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy ocpp-csms
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target ocpp-csms

  ocpp_reports:
    name: Deploy ocpp-reports
    needs: ocpp_csms
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'ocpp-reports') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy ocpp-reports
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target ocpp-reports

  ocpp_simulator:
    name: Deploy ocpp-simulator
    needs: ocpp_reports
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'ocpp-simulator') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy ocpp-simulator
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target ocpp-simulator

  gway_lcd_sound:
    name: Deploy gway-lcd-sound
    needs: ocpp_simulator
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-lcd-sound') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy gway-lcd-sound
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-lcd-sound

  gway_agent_ops:
    name: Deploy gway-agent-ops
    needs: gway_lcd_sound
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-agent-ops') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy gway-agent-ops
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-agent-ops

  gway_ap_kiosk:
    name: Deploy gway-ap-kiosk
    needs: gway_agent_ops
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-ap-kiosk') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy gway-ap-kiosk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-ap-kiosk

  gway_rfid:
    name: Deploy gway-rfid
    needs: gway_ap_kiosk
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-rfid') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy gway-rfid
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-rfid

  gway_bastion:
    name: Deploy gway-bastion (stage-only)
    needs: gway_rfid
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' && (inputs.repository == 'all' || inputs.repository == 'gway-bastion') }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage gway-bastion without activation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gway_remote deploy-batch --all --target gway-bastion
          echo "::notice::Bastion staged only; running services and keys unchanged"

  report:
    name: Export appliance deployment report
    needs: [ocpp_csms, ocpp_reports, ocpp_simulator, gway_lcd_sound, gway_agent_ops, gway_ap_kiosk, gway_rfid, gway_bastion]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.actor == 'arthexis' }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Summarize independent deployment outcomes
        shell: bash
        env:
          SELECTED_REPOSITORY: ${{ inputs.repository }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = {
              "ocpp_csms": "ocpp-csms",
              "ocpp_reports": "ocpp-reports",
              "ocpp_simulator": "ocpp-simulator",
              "gway_lcd_sound": "gway-lcd-sound",
              "gway_agent_ops": "gway-agent-ops",
              "gway_ap_kiosk": "gway-ap-kiosk",
              "gway_rfid": "gway-rfid",
              "gway_bastion": "gway-bastion",
          }
          results = json.loads(os.environ["JOB_RESULTS"])
          selected = os.environ["SELECTED_REPOSITORY"]
          lines = ["### Deployment job outcomes", "", "| Repository | Outcome |",
                   "|---|---|"]
          for job, repository in jobs.items():
              outcome = results[job]["result"]
              if outcome == "skipped" and selected not in ("all", repository):
                  outcome = "not selected"
              lines.append(f"| {repository} | {outcome} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n\n")
          PY
      - name: Export read-only sanitized report
        shell: bash
        run: |
          set -euo pipefail
          python3 -m gway_remote report-bundle --output "$RUNNER_TEMP/gway-remote-report"
          cat "$RUNNER_TEMP/gway-remote-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or refresh deployment failure issues
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_REPOSITORY: ${{ inputs.repository }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "$RUNNER_TEMP/gway-remote-report/summary.json" ]; then
            python3 -m gway_remote.deploy_failure_issues \
              --repo "$GITHUB_REPOSITORY" \
              --run-url "$RUN_URL" \
              --selected "$SELECTED_REPOSITORY" \
              --job-results "$JOB_RESULTS" \
              --report-dir "$RUNNER_TEMP/gway-remote-report"
          else
            echo "::warning::Report bundle missing; unable to publish failure issue"
          fi
      - name: Upload report and bounded sanitized logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gway-001-deploy-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gway-remote-report/
          retention-days: 14
          if-no-files-found: error
