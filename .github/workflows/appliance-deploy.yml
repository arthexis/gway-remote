name: Appliance Deploy
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry previously failed revisions (does not retry installed or interrupted attempts)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: gway-001-appliance
  cancel-in-progress: false

jobs:
  deploy:
    name: Gway-001 appliance deployment
    if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.actor == 'arthexis')
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute deployment batch
        id: batch
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          RETRY_FAILED: ${{ inputs.retry_failed || false }}
        shell: bash
        run: |
          set +e
          if [[ "$MANUAL" == "true" ]]; then
            if [[ "$RETRY_FAILED" == "true" ]]; then
              python3 -m gway_remote deploy-batch --now --retry-failed
            else
              python3 -m gway_remote deploy-batch --now
            fi
          else
            python3 -m gway_remote deploy-batch
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Deployment batch exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$code" != 0 ]]; then
            echo "::error::Deployment batch failed; inspect the sanitized report and installation logs artifact"
          fi
          exit 0
      - name: Export read-only sanitized report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m gway_remote report-bundle --output "$RUNNER_TEMP/gway-remote-report"
          cat "$RUNNER_TEMP/gway-remote-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and bounded sanitized logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gway-001-deploy-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gway-remote-report/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve deployment failure after uploading artifacts
        if: steps.batch.outputs.exit_code != '0' && steps.batch.outputs.exit_code != ''
        run: exit 1
