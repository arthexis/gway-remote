name: Appliance Report
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gway-001-appliance
  cancel-in-progress: false

jobs:
  report:
    name: Gway-001 read-only report
    if: github.actor == 'arthexis'
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export read-only sanitized report
        shell: bash
        run: |
          set -euo pipefail
          python3 -m gway_remote report-bundle --output "$RUNNER_TEMP/gway-remote-report"
          cat "$RUNNER_TEMP/gway-remote-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and bounded sanitized logs
        uses: actions/upload-artifact@v4
        with:
          name: gway-001-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gway-remote-report/
          retention-days: 14
          if-no-files-found: error
