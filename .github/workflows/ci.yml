name: Python checks
# Validation runs on PRs only. Merges to main are deployment events.
on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [codex, core, deployment, infrastructure, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Run subsystem tests with timings
        run: python -m pytest tests/${{ matrix.group }} -v --durations=0 --durations-min=0

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install 'pytest>=8,<10'
      - name: Enforce test layout and discovery with timings
        run: python -m pytest tests/support/test_architecture.py -v --durations=0 --durations-min=0
      - name: Validate CLI
        run: python -m gway_remote --help
      - name: Validate global CLI installer shell
        run: |
          sh -n scripts/install-cli.sh
          sh -n deploy.sh
      - name: Validate Ansible playbook syntax
        run: |
          python -m pip install 'ansible-core>=2.16,<2.19'
          ansible-playbook --syntax-check -i 'localhost,' ansible/playbook.yml
          ansible-playbook --syntax-check -i 'localhost,' ansible/playbooks/stage-release.yml
          ansible-playbook --syntax-check -i 'localhost,' ansible/playbooks/watchtower-mcp.yml

  ansible-core-2-12:
    name: Ansible Core 2.12 syntax
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Ansible Core
        run: |
          sudo apt-get update
          sudo apt-get install --yes ansible-core
      - name: Syntax-check deployed playbooks
        run: |
          export ANSIBLE_ROLES_PATH="$PWD/ansible/roles"
          ansible-playbook --version
          ansible-playbook --syntax-check -i 'gway_remote,' ansible/playbook.yml
          ansible-playbook --syntax-check -i 'localhost,' ansible/playbooks/stage-release.yml
          ansible-playbook --syntax-check -i 'wireguard_hub,' ansible/playbooks/adopt-wireguard-peer.yml
          ansible-playbook --syntax-check -i 'watchtower,' ansible/playbooks/watchtower-enrollment.yml
          ansible-playbook --syntax-check -i 'watchtower,' ansible/playbooks/watchtower-enrollment-production.yml

  ssh-config:
    name: SSH config (Debian 12 + 13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated relay configuration on real Debian OpenSSH
        run: |
          set -euo pipefail
          for release in bookworm trixie; do
            echo "::group::Debian ${release} sshd -t and sshd -T"
            docker run --rm --network=bridge \
              --mount type=bind,src="$PWD",dst=/repo,readonly \
              --workdir /repo \
              "debian:${release}" \
              sh -ec 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server python3 python3-yaml >/dev/null && python3 scripts/validate-ssh-relay.py'
            echo "::endgroup::"
          done

  ci:
    name: CI
    if: always()
    needs: [unit, validation, ansible-core-2-12, ssh-config]
    runs-on: ubuntu-latest
    steps:
      - name: Require all pull request checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          jobs = json.loads(os.environ["NEEDS_JSON"])
          failures = {name: result["result"] for name, result in jobs.items()
                      if result["result"] != "success"}
          if failures:
              print("PR validation failed or did not run:", failures)
              sys.exit(1)
          print("All PR validation jobs passed.")
          PY
