name: Python checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate CLI
        run: python -m gway_remote --help
      - name: Validate global CLI installer shell
        run: sh -n scripts/install-cli.sh
      - name: Validate Ansible playbook syntax
        run: |
          python -m pip install 'ansible-core>=2.16,<2.19'
          ansible-playbook --syntax-check -i 'localhost,' ansible/playbook.yml
