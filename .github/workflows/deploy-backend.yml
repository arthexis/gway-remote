name: Deploy GWay Remote backend

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gway-001-appliance-report
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'arthexis/gway-remote' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 15
    steps:
      - name: Confirm requested revision is still current main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api repos/arthexis/gway-remote/branches/main --jq '.commit.sha')"
          if [[ "$TARGET_SHA" != "$CURRENT_SHA" ]]; then
            echo "::notice::Skipping superseded main revision $TARGET_SHA (main is $CURRENT_SHA)"
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Full validation belongs to the PR CI gate, not the deployment runner.
      - name: Check deployment prerequisites
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v ansible-playbook
          command -v sudo
          test -f deploy.sh
      - name: Transactional install, restart and authenticated health
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          from gway_remote.deployment import deploy, local_api_token

          def install():
              with tempfile.TemporaryDirectory() as temp:
                  marker = pathlib.Path(temp) / "no-op"
                  env = os.environ.copy()
                  env["GWAY_REMOTE_DEPLOY_NOOP_FILE"] = str(marker)
                  subprocess.run(["sh", "deploy.sh"], check=True, env=env)
                  return not (marker.is_file() and marker.read_text().strip() == "skipped")

          deploy(token=local_api_token(), install=install)
          PY
          /usr/local/bin/gway-remote status --json | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"] == "gway-remote/status/v1"'
      - name: Deployment summary
        if: env.skip != 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
        run: echo "Processed GWay Remote deployment for $TARGET_SHA on gway-001" >> "$GITHUB_STEP_SUMMARY"

  watchtower:
    name: Deploy Watchtower MCP
    # Keep the one trusted ARM64 runner as the dispatch origin. The existing
    # pinned operator SSH route is the only remote hop; no new runner or secret.
    # Attempt Watchtower even if the gway-001 deployment failed.
    needs: deploy
    if: ${{ always() && github.repository == 'arthexis/gway-remote' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 20
    steps:
      - name: Reject superseded main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api repos/arthexis/gway-remote/branches/main --jq '.commit.sha')"
          if [[ "$TARGET_SHA" != "$CURRENT_SHA" ]]; then
            echo "::notice::Skipping superseded Watchtower revision $TARGET_SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.revision.outputs.skip != 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Converge reviewed Watchtower MCP release over existing operator SSH
        if: steps.revision.outputs.skip != 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/watchtower-auto-deploy.sh
          # Never forward a GH token, OAuth bearer, arbitrary shell command,
          # unreviewed path, or user-supplied target to Watchtower.
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=8 -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=2 gelectriic.com \
            "sh -s -- $TARGET_SHA" < scripts/watchtower-auto-deploy.sh
      - name: Verify live gway-001 MCP upstream advertises AgentOps submission
        if: steps.revision.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Watchtower's private bridge terminates at this node on 127.0.0.1:8770.
          # Inspect the *running* immutable backend, not the checkout or the
          # Watchtower gateway release; neither proves effective tool discovery.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          processes = subprocess.check_output(
              ["ps", "-eo", "args="], text=True).splitlines()
          candidates = []
          for line in processes:
              parts = line.split()
              if (len(parts) >= 4 and parts[0] == "/usr/bin/python3"
                      and parts[1] == "-I" and parts[-1] == "mcp_http"
                      and parts[2].startswith("/opt/gway-mcp/")
                      and parts[2].endswith("/run.py")):
                  candidates.append(Path(parts[2]).resolve(strict=True))
          if len(candidates) != 1:
              raise SystemExit(
                  f"Expected exactly one active isolated gway-001 MCP backend; found {len(candidates)}")
          release = candidates[0].parent
          if release.parent != Path("/opt/gway-mcp/releases"):
              raise SystemExit("Active MCP backend launcher resolves outside immutable releases")
          module = release / "gway_remote" / "mcp_agent.py"
          if not module.is_file() or '"name": "agent_submit"' not in module.read_text():
              raise SystemExit(
                  "MCP upstream drift: active gway-001 backend does not advertise agent_submit; "
                  "update the isolated backend before treating Watchtower deployment as complete")
          print("Active gway-001 MCP backend contains agent_submit")
          PY
      - name: Watchtower deployment summary
        if: steps.revision.outputs.skip != 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
        run: echo "Converged Watchtower MCP release $TARGET_SHA through existing Ansible rollback path" >> "$GITHUB_STEP_SUMMARY"
