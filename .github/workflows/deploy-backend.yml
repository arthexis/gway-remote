name: Deploy GWay Remote backend

on:
  workflow_run:
    workflows: ["Python checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: gway-001-appliance-report
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'arthexis/gway-remote'
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 15
    steps:
      - name: Confirm validated revision is current main
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api repos/arthexis/gway-remote/branches/main --jq '.commit.sha')"
          if [[ "$VERIFIED_SHA" != "$CURRENT_SHA" ]]; then
            echo "::notice::Skipping superseded revision $VERIFIED_SHA (main is $CURRENT_SHA)"
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install backend CLI
        if: env.skip != 'true'
        run: sh scripts/install-cli.sh
      - name: Verify installed CLI and API catalog
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          /usr/local/bin/gway-remote status --json | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"] == "gway-remote/status/v1"'
          /usr/local/bin/gway-remote --help >/dev/null
          python3 -m unittest discover -s tests -v
      - name: Deployment summary
        if: env.skip != 'true'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "Installed GWay Remote backend CLI from $VERIFIED_SHA on gway-001" >> "$GITHUB_STEP_SUMMARY"
