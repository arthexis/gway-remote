name: Deploy GWay Remote backend

on:
  workflow_run:
    workflows: ["Python checks"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: gway-001-appliance-report
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'arthexis/gway-remote'
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 15
    steps:
      - name: Confirm validated revision is current main
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api repos/arthexis/gway-remote/branches/main --jq '.commit.sha')"
          if [[ "$VERIFIED_SHA" != "$CURRENT_SHA" ]]; then
            echo "::notice::Skipping superseded revision $VERIFIED_SHA (main is $CURRENT_SHA)"
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate backend before installation
        if: env.skip != 'true'
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m gway_remote --help >/dev/null
      - name: Transactional install, restart and authenticated health
        if: env.skip != 'true'
        env:
          GWAY_REMOTE_API_TOKEN: ${{ secrets.GWAY_REMOTE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GWAY_REMOTE_API_TOKEN:-}" || { echo "::error::Configure GWAY_REMOTE_API_TOKEN as an Actions secret before deployment"; exit 1; }
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user is-active --quiet gway-remote-mobile-api.service
          test -s /usr/local/bin/gway-remote
          BACKUP="$(mktemp -p "$RUNNER_TEMP" gway-remote-backup.XXXXXXXX)"
          sudo -n cp -p /usr/local/bin/gway-remote "$BACKUP"
          sudo -n chown "$(id -u):$(id -g)" "$BACKUP"
          restore() {
            echo "::error::Deployment failed; restoring previous executable"
            sudo -n install -m 755 "$BACKUP" /usr/local/bin/gway-remote
            systemctl --user restart gway-remote-mobile-api.service || true
            if ! health; then echo "::error::Rollback health verification failed"; fi
          }
          health() {
            python3 - <<'PY'
          import json, os, time, urllib.request
          url = "http://10.90.0.2:8765/api/v1/health"
          for _ in range(15):
              try:
                  req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GWAY_REMOTE_API_TOKEN"]})
                  with urllib.request.urlopen(req, timeout=2) as response:
                      data = json.load(response)
                  if data == {"status": "ok", "api": "gway-remote/v1"}:
                      raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(1)
          raise SystemExit("Authenticated mobile API health check failed")
          PY
          }
          trap 'restore' ERR
          sh scripts/install-cli.sh
          /usr/local/bin/gway-remote status --json | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"] == "gway-remote/status/v1"'
          systemctl --user restart gway-remote-mobile-api.service
          systemctl --user is-active --quiet gway-remote-mobile-api.service
          health
          trap - ERR
          rm -f "$BACKUP"
      - name: Deployment summary
        if: env.skip != 'true'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "Installed and restarted GWay Remote mobile API from $VERIFIED_SHA on gway-001" >> "$GITHUB_STEP_SUMMARY"
