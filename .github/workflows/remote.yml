name: Remote workloads
on:
  repository_dispatch:
    types: [system-health, ocpp-simulator, lcd-sound-deploy, ocpp-csms-deploy]
  workflow_dispatch:
    inputs:
      task:
        type: choice
        required: true
        options: [system-health]

permissions:
  contents: read

concurrency:
  group: remote-${{ github.event.client_payload.repository || 'local' }}-${{ github.event.client_payload.pr || 'manual' }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.verify.outputs.task }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify allowed request against GitHub PR metadata
        id: verify
        env:
          TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || github.event.action }}
          REPO: ${{ github.event.client_payload.repository || '' }}
          SHA: ${{ github.event.client_payload.sha || '' }}
          PR: ${{ github.event.client_payload.pr || '' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TASK" == system-health && -z "$REPO" && -z "$SHA" && -z "$PR" ]]; then
            echo "task=system-health" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$TASK" == ocpp-csms-deploy ]]; then
            [[ "$REPO" == arthexis/ocpp-csms && "$SHA" =~ ^[0-9a-fA-F]{40}$ && -z "$PR" ]]
            MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
            [[ "$SHA" == "$MAIN_SHA" ]]
            echo "task=ocpp-csms-deploy" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$TASK" == lcd-sound-deploy ]]; then
            [[ "$REPO" == arthexis/gway-lcd-sound && "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            # Only deploy the current default-branch tip, never a PR or arbitrary SHA.
            MAIN_SHA="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
            [[ "$SHA" == "$MAIN_SHA" ]]
            echo "task=lcd-sound-deploy" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$TASK" == ocpp-simulator && "$REPO" == arthexis/ocpp-csms ]]
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ && "$PR" =~ ^[1-9][0-9]*$ ]]
          # API response is authoritative, unlike dispatch client_payload.
          gh api "repos/$REPO/pulls/$PR" > pr.json
          jq -e --arg sha "$SHA" '
            .state == "open" and .draft == false and
            .user.login == "arthexis" and
            .head.repo.full_name == "arthexis/ocpp-csms" and
            .head.sha == $sha and
            ([.labels[].name] | index("simulator") != null)
          ' pr.json >/dev/null
          echo "task=ocpp-simulator" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  execute:
    needs: authorize
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run registered task
        env:
          TASK: ${{ needs.authorize.outputs.task }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TASK" == "system-health" ]]; then
            python3 -m gway_remote run system-health
          elif [[ "$TASK" == "lcd-sound-deploy" ]]; then
            python3 -m gway_remote run lcd-sound-deploy --repository arthexis/gway-lcd-sound --sha "$SHA"
          elif [[ "$TASK" == "ocpp-csms-deploy" ]]; then
            python3 -m gway_remote run ocpp-csms-deploy --repository arthexis/ocpp-csms --sha "$SHA"
          else
            python3 -m gway_remote run ocpp-simulator --repository arthexis/ocpp-csms --sha "$SHA"
          fi

  report:
    if: always() && github.event_name == 'repository_dispatch' && github.event.action == 'ocpp-simulator'
    needs: [authorize, execute]
    runs-on: ubuntu-latest
    steps:
      - name: Report verified outcome to originating commit
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_STATUS_TOKEN }}
          SHA: ${{ needs.authorize.outputs.sha }}
          AUTH_RESULT: ${{ needs.authorize.result }}
          JOB_RESULT: ${{ needs.execute.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Never publish a status to a caller-supplied SHA unless authorization passed.
          if [[ "$AUTH_RESULT" != success || -z "$SHA" ]]; then
            echo "::warning::Request denied. No callback attempted."
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GWAY_REMOTE_STATUS_TOKEN is not configured"
            exit 1
          fi
          case "$JOB_RESULT" in
            success) state=success ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/arthexis/ocpp-csms/statuses/$SHA" \
            -f state="$state" \
            -f context="gway-remote/simulator" \
            -f target_url="$RUN_URL" \
            -f description="Remote simulator: $JOB_RESULT"
