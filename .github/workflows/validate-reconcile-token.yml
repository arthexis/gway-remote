name: Validate reconciliation token
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'gway_remote/github_state.py'
      - '.github/workflows/validate-reconcile-token.yml'

permissions:
  contents: read

jobs:
  validate:
    # Never expose a cross-repository secret to untrusted fork PR code.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'arthexis')
    runs-on: ubuntu-latest
    steps:
      - name: Verify read-only API permissions
        env:
          GH_TOKEN: ${{ secrets.GWAY_REMOTE_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::GWAY_REMOTE_DISPATCH_TOKEN is not configured"; exit 1; }
          for repo in arthexis/ocpp-csms arthexis/ocpp-simulator arthexis/gway-lcd-sound; do
            echo "Checking $repo"
            gh api "repos/$repo/branches/main" --jq '.commit.sha' >/dev/null
            gh api "repos/$repo/actions/runs?branch=main&per_page=1" --jq '.total_count' >/dev/null
            gh api "repos/$repo/deployments?environment=gway-001&per_page=1" --jq 'length' >/dev/null
            echo "$repo: branch, Actions and deployments readable"
          done
