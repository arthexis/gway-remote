# Declarative appliance management inventory. An empty list denies Remote writes.
all:
  children:
    controller:
      hosts:
        gway-001:
          ansible_connection: local
          # Pilot only: the operator owns installation, node jobs and MCP providers.
          # The SSH ingress remains the restricted gway-relay account.
          gway_remote_exec_run_user: arthe
          # Explicit opt-in: private runtime and pinned installed AgentOps CLI.
          gway_agent_mcp_workspace: /home/arthe/.local/share/gway-agent-ops/workspaces
          gway_agent_mcp_executable: /home/arthe/.local/share/gway-agent-ops/releases/ac1ff877ef521f0a2fde82a665f3acea207817b6/bin/agent
          gway_agent_allowed_repos:
            - arthexis/gway-agent-ops
            - arthexis/gway-remote
          remote_managed_repositories:
            - ocpp-csms
            - gway-lcd-sound
            - gway-agent-ops
            - gway-ap-kiosk
            - gway-rfid
            - gway-bastion
            - odoo-gelectriic
    quality:
      hosts:
        gway-004:
          remote_inspection_allowed: true
          remote_managed_repositories: []
    production:
      hosts:
        gway-002:
          remote_managed_repositories: []
        gway-005:
          remote_managed_repositories: []
        customer.gelectriic.com:
          remote_managed_repositories: []
