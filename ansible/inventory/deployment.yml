# Declarative appliance management inventory. An empty list denies Remote writes.
all:
  children:
    controller:
      hosts:
        gway-001:
          ansible_connection: local
          # Explicit opt-in: private runtime and pinned installed AgentOps CLI.
          gway_agent_mcp_workspace: /home/arthe/.local/share/gway-agent-ops/workspaces
          gway_agent_mcp_executable: /home/arthe/.local/share/gway-agent-ops/releases/69788f723e58fcc7e2b512f7c9b0499045b8ad52/bin/agent
          gway_agent_allowed_repos:
            - arthexis/gway-agent-ops
            - arthexis/gway-remote
          remote_managed_repositories:
            - ocpp-csms
            - ocpp-reports
            - gway-lcd-sound
            - gway-agent-ops
            - gway-ap-kiosk
            - gway-rfid
            - gway-bastion
            - odoo-gelectriic
    quality:
      hosts:
        gway-004:
          remote_inspection_allowed: true
          remote_managed_repositories: []
    production:
      hosts:
        gway-002:
          remote_managed_repositories: []
        gway-005:
          remote_managed_repositories: []
        customer.gelectriic.com:
          remote_managed_repositories: []
