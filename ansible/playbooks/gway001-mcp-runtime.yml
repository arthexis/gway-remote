---
# Runs only on the existing gway-001 runner, after the ordinary deployment.
# Stage immutable reviewed code, then restart the existing user service.
- name: Converge isolated gway-001 MCP backend
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mcp_source: "{{ playbook_dir }}/../.."
    mcp_root: /opt/gway-mcp
    mcp_user: "{{ lookup('env', 'USER') }}"
    mcp_runtime_dir: "/run/user/{{ lookup('pipe', 'id -u') }}"
  tasks:
    - name: Require attested local appliance and exact workflow revision
      ansible.builtin.assert:
        that:
          - lookup('pipe', 'hostname -s') == 'gway-001'
          - mcp_target_sha is defined
          - mcp_target_sha is match('^[0-9a-f]{40}$')
          - lookup('pipe', 'git -C ' ~ mcp_source ~ ' rev-parse HEAD') == mcp_target_sha
          - mcp_user == 'arthe'
    - name: Require existing protected runtime and user service
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /opt/gway-mcp/current
        - /home/arthe/.config/systemd/user/gway-remote-mcp.service
      register: prerequisites
    - name: Refuse implicit first-time service provisioning
      ansible.builtin.assert:
        that:
          - prerequisites.results[0].stat.islnk | default(false)
          - prerequisites.results[1].stat.isreg | default(false)
          - not (prerequisites.results[1].stat.islnk | default(false))
    - name: Inspect existing operator-approved MCP source policy
      become: true
      ansible.builtin.stat:
        path: /etc/gway-mcp-gateway/sources.json
        checksum_algorithm: sha256
        follow: false
      register: source_policy
    - name: Require protected approved source policy when present
      ansible.builtin.assert:
        that:
          - source_policy.stat.isreg
          - not (source_policy.stat.islnk | default(false))
          - source_policy.stat.pw_name == 'root'
          - source_policy.stat.mode in ['0644', '0640', '0600', '0444', '0440', '0400']
      when: source_policy.stat.exists
    - name: Activate existing source policy in the MCP service environment
      ansible.builtin.lineinfile:
        path: /home/arthe/.config/gway-remote/mcp.env
        regexp: '^{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
        create: false
        mode: '0600'
      loop:
        - { key: GWAY_MCP_SOURCE_POLICY, value: /etc/gway-mcp-gateway/sources.json }
        - { key: GWAY_MCP_SOURCE_POLICY_SHA256, value: "{{ source_policy.stat.checksum | default('') }}" }
      register: source_policy_env
      when: source_policy.stat.exists
    - name: Converge administratively installed node MCP manifests
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - "{{ mcp_source }}/scripts/converge-mcp-manifests.py"
      changed_when: false
    - name: Verify installed MCP manifests are discoverable
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "from gway_remote.mcp_installed_providers import discover_installed_providers; print([r.source_id for r in discover_installed_providers()])"
      environment:
        PYTHONPATH: "{{ mcp_source }}"
      changed_when: false
    - name: Capture previous release for rollback
      become: true
      ansible.builtin.command:
        argv: [readlink, /opt/gway-mcp/current]
      changed_when: false
      register: previous_release
    - name: Validate previous immutable release pointer
      ansible.builtin.assert:
        that:
          - previous_release.stdout is match('^releases/[0-9a-f]{40}$')
    - name: Stage, activate and verify isolated MCP backend
      block:
        - name: Stage exact reviewed MCP release
          become: true
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -I
              - "{{ mcp_source }}/scripts/stage-mcp-runtime.py"
              - --source
              - "{{ mcp_source }}"
              - --revision
              - "{{ mcp_target_sha }}"
          changed_when: previous_release.stdout != 'releases/' ~ mcp_target_sha or (source_policy_env is changed)
        - name: Verify staged module imports
          become: true
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, /opt/gway-mcp/current/run.py, --check]
          changed_when: false
        - name: Restart existing user MCP service only for changed release
          ansible.builtin.command:
            argv: [systemctl, --user, restart, gway-remote-mcp.service]
          environment:
            XDG_RUNTIME_DIR: "{{ mcp_runtime_dir }}"
            DBUS_SESSION_BUS_ADDRESS: "unix:path={{ mcp_runtime_dir }}/bus"
          when: previous_release.stdout != 'releases/' ~ mcp_target_sha
        - name: Require active user MCP backend
          ansible.builtin.command:
            argv: [systemctl, --user, is-active, --quiet, gway-remote-mcp.service]
          environment:
            XDG_RUNTIME_DIR: "{{ mcp_runtime_dir }}"
            DBUS_SESSION_BUS_ADDRESS: "unix:path={{ mcp_runtime_dir }}/bus"
          changed_when: false
        - name: Verify active runtime matches requested revision
          become: true
          ansible.builtin.command:
            argv: [readlink, /opt/gway-mcp/current]
          changed_when: false
          register: active_release
        - name: Refuse runtime drift
          ansible.builtin.assert:
            that: active_release.stdout == 'releases/' ~ mcp_target_sha
      rescue:
        - name: Restore previous immutable release pointer
          become: true
          ansible.builtin.file:
            path: /opt/gway-mcp/current
            src: "{{ previous_release.stdout }}"
            state: link
            force: true
        - name: Restart restored user MCP backend
          ansible.builtin.command:
            argv: [systemctl, --user, restart, gway-remote-mcp.service]
          environment:
            XDG_RUNTIME_DIR: "{{ mcp_runtime_dir }}"
            DBUS_SESSION_BUS_ADDRESS: "unix:path={{ mcp_runtime_dir }}/bus"
        - name: Abort deployment on failed MCP runtime
          ansible.builtin.fail:
            msg: Isolated MCP update failed; previous release was restored.
