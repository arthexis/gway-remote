---
# A fixed local recipe, not a caller-selected playbook or inventory.
- name: Deploy generic Odoo Gelectriic CLI on the attested controller
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars:
    gway_remote_runner_user: __RUNNER__
  tasks:
    - name: Require exact controller identity
      ansible.builtin.assert:
        that:
          - ansible_hostname == 'gway-001'
        fail_msg: Odoo CLI deployment only supported on gway-001
    - name: Resolve operator home
      ansible.builtin.getent:
        database: passwd
        key: "{{ gway_remote_runner_user }}"
    - name: Converge reusable Odoo CLI from the reviewed checkout
      ansible.builtin.include_tasks: __GWAY_CHECKOUT__/ansible/roles/gway_remote/tasks/odoo-gelectriic.yml
