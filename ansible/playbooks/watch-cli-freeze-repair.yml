---
# Deliberately independent of full appliance deployment. Rebuild the CLI
# from the already installed receiver; preserve its release pointer/ledger.
- name: Repair existing watch CLI in reconciliation-only freeze mode
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    watch_unit: gway-remote-watch.service
    watch_timer: gway-remote-watch.timer
    watch_override: /etc/systemd/system/gway-remote-watch.service.d/90-freeze-read-only.conf
  tasks:
    - name: Require explicit named satellite and installed receiver
      ansible.builtin.assert:
        that:
          - ansible_hostname is match('^gway-[0-9]+$')
          - ansible_hostname != 'gway-001'
          - watch_cli_freeze_authorize | default(false) | bool
          - watch_cli_freeze_node | default('') == ansible_hostname
    - name: Inspect watch service and timer without changing state
      ansible.builtin.command:
        argv: [systemctl, show, "{{ item }}", --property=ActiveState, --property=FragmentPath, --property=User, --property=ExecStart, --property=UnitFileState]
      loop: ["{{ watch_unit }}", "{{ watch_timer }}"]
      register: watch_state
      changed_when: false
    - name: Require existing idle watch service and expected execution contract
      ansible.builtin.assert:
        that:
          - "'ActiveState=inactive' in watch_state.results[0].stdout_lines or 'ActiveState=failed' in watch_state.results[0].stdout_lines"
          - "'FragmentPath=/etc/systemd/system/gway-remote-watch.service' in watch_state.results[0].stdout_lines"
          - "'User=arthe' in watch_state.results[0].stdout_lines"
          - "'argv[]=/usr/local/bin/gway-remote watch' in watch_state.results[0].stdout"
          - "'FragmentPath=/etc/systemd/system/gway-remote-watch.timer' in watch_state.results[1].stdout_lines"
    - name: Inspect protected installation paths
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /opt/gway-remote
        - /opt/gway-remote/scripts
        - /opt/gway-remote/scripts/install-cli.sh
        - /usr/local/bin/gway-remote
        - /etc/systemd/system/gway-remote-watch.service.d
        - "{{ watch_override }}"
        - /etc/gway-remote/deployment.yml
      register: watch_paths
    - name: Refuse missing or unsafe installation paths
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.uid == 0
          - not item.stat.islnk
          - item.stat.mode in ['0755', '0644']
          - (item.item in ['/opt/gway-remote', '/opt/gway-remote/scripts'] and item.stat.isdir) or (item.item not in ['/opt/gway-remote', '/opt/gway-remote/scripts'] and item.stat.isreg)
      loop: "{{ watch_paths.results[:4] }}"
    - name: Refuse unsafe override directory or file
      ansible.builtin.assert:
        that: not item.stat.exists or (item.stat.uid == 0 and not item.stat.islnk and ((item.item == watch_override and item.stat.isreg and item.stat.mode == '0644') or (item.item != watch_override and item.stat.isdir and item.stat.mode == '0755')))
      loop: "{{ watch_paths.results[4:6] }}"
    - name: Read any previously installed freeze override
      ansible.builtin.slurp:
        src: "{{ watch_override }}"
      register: existing_watch_override
      when: watch_paths.results[5].stat.exists
    - name: Refuse to replace unrelated watch override
      ansible.builtin.assert:
        that: (existing_watch_override.content | b64decode) in ['[Service]\nExecStart=\nExecStart=/usr/local/bin/gway-remote watch\n', '[Service]\nExecStart=\nExecStart=/usr/local/bin/gway-remote watch\nEnvironment=ANSIBLE_LOCAL_TEMP=/tmp\n']
      when: watch_paths.results[5].stat.exists
    - name: Verify canonical inventory gives this satellite no managed deployment permissions
      ansible.builtin.command:
        argv: [ansible-inventory, -i, "{{ playbook_dir }}/../inventory/deployment.yml", --host, "{{ ansible_hostname }}"]
      register: canonical_watch_policy
      changed_when: false
      failed_when: canonical_watch_policy.rc != 0 or (canonical_watch_policy.stdout | from_json).remote_managed_repositories != []
    - name: Reject unsafe existing deployment policy
      ansible.builtin.assert:
        that: not watch_paths.results[6].stat.exists or (watch_paths.results[6].stat.uid == 0 and watch_paths.results[6].stat.isreg and not watch_paths.results[6].stat.islnk and watch_paths.results[6].stat.mode == '0644')
    - name: Verify existing inventory grants no satellite deployment permissions
      ansible.builtin.command:
        argv: [ansible-inventory, -i, /etc/gway-remote/deployment.yml, --host, "{{ ansible_hostname }}"]
      register: installed_watch_policy
      changed_when: false
      failed_when: installed_watch_policy.rc != 0 or (installed_watch_policy.stdout | from_json).remote_managed_repositories != []
      when: watch_paths.results[6].stat.exists
    - name: Verify installed receiver resolves to protected archive and already has corrected kiosk probe
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib, sys
            root = pathlib.Path('/opt/gway-remote/.package-releases').resolve()
            p = pathlib.Path('/opt/gway-remote/gway_remote').resolve(strict=True)
            assert p.parent.parent == root and p.name == 'gway_remote'
            for q in (root, p.parent, p, p / 'health.py'):
                s = q.stat()
                assert s.st_uid == 0 and not s.st_mode & 0o022
            sys.path.insert(0, str(p.parent))
            from gway_remote.health import quick_component_check
            assert quick_component_check('gway-ap-kiosk') == 'release-missing'
      changed_when: false
    - name: Compare CLI archive package sources with installed receiver
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import pathlib, zipfile
            root = pathlib.Path('/opt/gway-remote/gway_remote')
            with zipfile.ZipFile('/usr/local/bin/gway-remote') as z:
                files = {str(p.relative_to(root)) for p in root.rglob('*.py')}
                archived = {n.removeprefix('gway_remote/') for n in z.namelist()
                            if n.startswith('gway_remote/') and n.endswith('.py')}
                print('current' if files == archived and all(
                    z.read('gway_remote/' + n) == (root / n).read_bytes()
                    for n in files) else 'stale')
      register: cli_package
      changed_when: false
    - name: Stop only existing active watch timer during CLI repair
      ansible.builtin.systemd:
        name: "{{ watch_timer }}"
        state: stopped
      when:
        - "'ActiveState=active' in watch_state.results[1].stdout_lines"
        - cli_package.stdout == 'stale' or '--apply' in watch_state.results[0].stdout or not watch_paths.results[6].stat.exists or not watch_paths.results[5].stat.exists or 'Environment=ANSIBLE_LOCAL_TEMP=/tmp' not in (existing_watch_override.content | default('') | b64decode)
    - name: Verify no watch operation is running
      ansible.builtin.command:
        argv: [systemctl, show, "{{ watch_unit }}", --property=ActiveState, --value]
      register: watch_idle
      changed_when: false
      failed_when: watch_idle.stdout not in ['inactive', 'failed']
    - name: Create protected override directory
      ansible.builtin.file:
        path: /etc/systemd/system/gway-remote-watch.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Persist read-only watch mode before repairing executable
      ansible.builtin.copy:
        dest: "{{ watch_override }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/local/bin/gway-remote watch
          Environment=ANSIBLE_LOCAL_TEMP=/tmp
      register: watch_mode
    - name: Reload systemd units without restarting services
      ansible.builtin.systemd:
        daemon_reload: true
      when: watch_mode.changed or '--apply' in watch_state.results[0].stdout
    - name: Verify effective command cannot dispatch deployments
      ansible.builtin.command:
        argv: [systemctl, show, "{{ watch_unit }}", --property=ExecStart, --value]
      register: watch_command
      changed_when: false
      failed_when: "'argv[]=/usr/local/bin/gway-remote watch ;' not in watch_command.stdout or '--apply' in watch_command.stdout"
    - name: Install missing canonical inventory without granting satellite deployment authority
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../inventory/deployment.yml"
        dest: /etc/gway-remote/deployment.yml
        owner: root
        group: root
        mode: '0644'
        force: false
      when: not watch_paths.results[6].stat.exists
    - name: Verify live installed inventory still grants no deployment authority
      ansible.builtin.command:
        argv: [ansible-inventory, -i, /etc/gway-remote/deployment.yml, --host, "{{ ansible_hostname }}"]
      register: verified_watch_policy
      changed_when: false
      failed_when: verified_watch_policy.rc != 0 or (verified_watch_policy.stdout | from_json).remote_managed_repositories != []
    - name: Converge repository-owned CLI installer with archive support
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/install-cli.sh"
        dest: /opt/gway-remote/scripts/install-cli.sh
        owner: root
        group: root
        mode: '0755'
    - name: Preserve original CLI archive for recovery
      ansible.builtin.copy:
        src: /usr/local/bin/gway-remote
        dest: /opt/gway-remote/scripts/gway-remote.pre-freeze-cli-repair
        remote_src: true
        owner: root
        group: root
        mode: '0755'
        force: false
      when: cli_package.stdout == 'stale'
    - name: Refresh only stale CLI from installed receiver package
      ansible.builtin.command:
        argv: [/bin/sh, /opt/gway-remote/scripts/install-cli.sh]
      environment:
        GWAY_INSTALL_FEED_ALIAS: '0'
      when: cli_package.stdout == 'stale'
    - name: Verify repaired archive uses corrected read-only probe
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import sys
            sys.path.insert(0, '/usr/local/bin/gway-remote')
            from gway_remote.health import quick_component_check
            assert quick_component_check('gway-ap-kiosk') == 'release-missing'
      changed_when: false
    - name: Restore only previously active watch timer with read-only command
      ansible.builtin.systemd:
        name: "{{ watch_timer }}"
        state: started
      when: "'ActiveState=active' in watch_state.results[1].stdout_lines"
