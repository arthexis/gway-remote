---
- name: Activate dedicated Watchtower Activity Feed
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    feed_src: "{{ playbook_dir }}/../.."
    feed_dropin: /etc/systemd/system/gway-mcp-gateway.service.d/70-activity-feed.conf
  tasks:
    - name: Allocate only fixed private Feed backing file (never a physical device)
      ansible.builtin.command:
        argv: [/usr/bin/python3, "{{ feed_src }}/scripts/provision-watchtower-feed-volume.py", prepare]
      register: feed_prepare
      changed_when: "'changed=true' in feed_prepare.stdout"

    - name: Inspect exact managed mount unit before any replacement
      ansible.builtin.stat:
        path: /etc/systemd/system/var-lib-gwayfeed.mount
        follow: false
        checksum_algorithm: sha256
      register: feed_prior_mount

    - name: Refuse unrelated mount unit
      ansible.builtin.assert:
        that:
          - not feed_prior_mount.stat.exists or (feed_prior_mount.stat.isreg | default(false) and feed_prior_mount.stat.uid == 0 and feed_prior_mount.stat.checksum == (lookup('file', feed_src + '/deploy/mcp-bearer/var-lib-gwayfeed.mount', rstrip=False) | hash('sha256')))

    - name: Install dedicated mount unit
      ansible.builtin.copy:
        src: "{{ feed_src }}/deploy/mcp-bearer/var-lib-gwayfeed.mount"
        dest: /etc/systemd/system/var-lib-gwayfeed.mount
        owner: root
        group: root
        mode: '0644'
      register: feed_mount_unit

    - name: Activate persistent dedicated mount
      ansible.builtin.systemd:
        name: var-lib-gwayfeed.mount
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify exact backing and capacity before setting private owner
      ansible.builtin.command:
        argv: [/usr/bin/python3, "{{ feed_src }}/scripts/provision-watchtower-feed-volume.py", finish]
      register: feed_finish
      changed_when: "'changed=true' in feed_finish.stdout"

    - name: Inspect existing grant directory
      ansible.builtin.stat:
        path: /etc/gway-remote
        follow: false
      register: feed_grant_dir

    - name: Refuse unsafe existing grant directory
      ansible.builtin.assert:
        that:
          - not feed_grant_dir.stat.exists or (feed_grant_dir.stat.isdir | default(false) and feed_grant_dir.stat.uid == 0 and not (feed_grant_dir.stat.wgrp | default(true)) and not (feed_grant_dir.stat.woth | default(true)))

    - name: Create grant directory only if absent
      ansible.builtin.file:
        path: /etc/gway-remote
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: not feed_grant_dir.stat.exists

    - name: Preserve existing grant registry or initialize empty policy
      ansible.builtin.copy:
        content: '{"schema":1,"grants":{}}'
        dest: /etc/gway-remote/activity-feed-sources.json
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Ensure existing gateway drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/gway-mcp-gateway.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Inspect existing dedicated feed drop-in
      ansible.builtin.stat:
        path: "{{ feed_dropin }}"
        follow: false
        checksum_algorithm: sha256
      register: feed_prior

    - name: Refuse replacing unrelated activation settings
      ansible.builtin.assert:
        that:
          - not feed_prior.stat.exists or (feed_prior.stat.isreg | default(false) and feed_prior.stat.uid == 0 and feed_prior.stat.checksum == (lookup('file', feed_src + '/deploy/mcp-bearer/70-activity-feed.conf', rstrip=False) | hash('sha256')))

    - name: Activate receiver with rollback
      block:
        - name: Install dedicated feed environment and writable path
          ansible.builtin.copy:
            src: "{{ feed_src }}/deploy/mcp-bearer/70-activity-feed.conf"
            dest: "{{ feed_dropin }}"
            owner: root
            group: root
            mode: '0644'
          register: feed_change

        - name: Restart only gateway on changed Feed activation
          ansible.builtin.systemd:
            name: gway-mcp-gateway.service
            daemon_reload: true
            state: restarted
          when: feed_change.changed

        - name: Check existing MCP health
          ansible.builtin.uri:
            url: http://127.0.0.1:19010/mcp
            status_code: 405
            timeout: 5
          register: feed_mcp_health
          retries: 6
          delay: 2
          until: feed_mcp_health.status | default(0) == 405
          changed_when: false

        - name: Verify active receiver rejects unauthenticated access
          ansible.builtin.uri:
            url: http://127.0.0.1:19010/api/feed/events
            status_code: 401
            timeout: 5
          register: feed_receiver_health
          retries: 6
          delay: 2
          until: feed_receiver_health.status | default(0) == 401
          changed_when: false

        - name: Verify central DB initialized by gateway owner
          ansible.builtin.stat:
            path: /var/lib/gwayfeed/events.sqlite3
            follow: false
          register: feed_db
          retries: 5
          delay: 2
          until: feed_db.stat.exists | default(false)

        - name: Require private database
          ansible.builtin.assert:
            that:
              - feed_db.stat.isreg
              - feed_db.stat.pw_name == 'gway-mcp-gateway'
              - feed_db.stat.mode == '0600'

        - name: Install bounded local inventory and maintenance units
          ansible.builtin.copy:
            src: "{{ feed_src }}/deploy/mcp-bearer/{{ item }}"
            dest: "/etc/systemd/system/{{ item }}"
            owner: root
            group: root
            mode: '0644'
          loop:
            - gway-feed-maintenance.service
            - gway-feed-maintenance.timer

        - name: Verify real inventory baseline and retention locally
          ansible.builtin.systemd:
            name: gway-feed-maintenance.service
            daemon_reload: true
            state: started
          when: feed_change.changed

        - name: Enable maintenance timer
          ansible.builtin.systemd:
            name: gway-feed-maintenance.timer
            daemon_reload: true
            enabled: true
            state: started

      rescue:
        - name: Remove only newly introduced activation drop-in
          ansible.builtin.file:
            path: "{{ feed_dropin }}"
            state: absent
          when: not feed_prior.stat.exists

        - name: Restore normal gateway service without deleting Feed storage
          ansible.builtin.systemd:
            name: gway-mcp-gateway.service
            daemon_reload: true
            state: restarted
          when: not feed_prior.stat.exists

        - name: Report incomplete activation
          ansible.builtin.fail:
            msg: Feed activation incomplete; persistent data preserved for inspection.
