---
# Applied by the ordinary deploy.sh only on an already-provisioned Watchtower.
# Does not manage Nginx, bearer credentials, WireGuard or gway-001 services.
- name: Converge existing Watchtower MCP OAuth link
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    mcp_source: "{{ playbook_dir }}/../.."
    mcp_root: /opt/gway-mcp
    mcp_unit: gway-mcp-link.service
  tasks:
    - name: Resolve reviewed repository commit
      ansible.builtin.command:
        argv: [git, -C, "{{ mcp_source }}", rev-parse, --verify, HEAD]
      changed_when: false
      register: mcp_sha

    - name: Require a full pinned revision
      ansible.builtin.assert:
        that: mcp_sha.stdout is match('^[0-9a-f]{40}$')

    - name: Require existing isolated link configuration and installed service
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /etc/gway-mcp-gateway/link.env
        - /etc/systemd/system/gway-mcp-link.service
        - /opt/gway-mcp/current
        - /etc/systemd/system/gway-mcp-gateway.service
      register: mcp_prerequisites

    - name: Refuse first-time deployment or unexpected paths
      ansible.builtin.assert:
        that:
          - mcp_prerequisites.results[0].stat.isreg | default(false)
          - not (mcp_prerequisites.results[0].stat.islnk | default(false))
          - mcp_prerequisites.results[1].stat.isreg | default(false)
          - not (mcp_prerequisites.results[1].stat.islnk | default(false))
          - mcp_prerequisites.results[2].stat.islnk | default(false)
          - mcp_prerequisites.results[3].stat.isreg | default(false)
          - not (mcp_prerequisites.results[3].stat.islnk | default(false))
        fail_msg: Watchtower MCP requires prior explicit credential/service provisioning.

    - name: Read existing release pointer
      become: true
      ansible.builtin.command:
        argv: [readlink, /opt/gway-mcp/current]
      changed_when: false
      register: mcp_original_target

    - name: Reject unexpected current pointer
      ansible.builtin.assert:
        that: mcp_original_target.stdout is match('^releases/[0-9a-f]{40}$')

    - name: Verify original isolated runtime before convergence
      become: true
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, /opt/gway-mcp/current/run.py, --check]
      changed_when: false

    - name: Check current OAuth link unit content
      become: true
      ansible.builtin.stat:
        path: /etc/systemd/system/gway-mcp-link.service
        checksum_algorithm: sha256
      register: mcp_unit_before

    - name: Read current OAuth unit for exact rollback
      become: true
      ansible.builtin.slurp:
        src: /etc/systemd/system/gway-mcp-link.service
      register: mcp_original_unit

    - name: Detect checked-in service unit change
      ansible.builtin.stat:
        path: "{{ mcp_source }}/deploy/mcp-bearer/gway-mcp-link.service"
        checksum_algorithm: sha256
      register: mcp_unit_source

    - name: Check whether OAuth link service is currently active
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, gway-mcp-link.service]
      register: mcp_active
      failed_when: false
      changed_when: false

    - name: Check whether the dedicated MCP gateway is enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, --quiet, gway-mcp-gateway.service]
      register: mcp_gateway_enabled
      failed_when: false
      changed_when: false

    - name: Require an already enabled private gateway
      ansible.builtin.assert:
        that: mcp_gateway_enabled.rc == 0
        fail_msg: Refusing implicit gateway activation; provision the MCP gateway explicitly.

    - name: Check whether the private MCP gateway is running
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, gway-mcp-gateway.service]
      register: mcp_gateway_active
      failed_when: false
      changed_when: false

    - name: Determine gateway restart requirement
      ansible.builtin.set_fact:
        mcp_gateway_activation_needed: >-
          {{ mcp_original_target.stdout != 'releases/' ~ mcp_sha.stdout or
             mcp_gateway_active.rc != 0 }}

    - name: Determine whether service restart is required
      ansible.builtin.set_fact:
        mcp_activation_needed: >-
          {{ mcp_original_target.stdout != 'releases/' ~ mcp_sha.stdout or
             mcp_unit_before.stat.checksum != mcp_unit_source.stat.checksum or
             mcp_active.rc != 0 }}

    - name: Stage and activate only the dedicated MCP runtime
      block:
        - name: Stage reviewed isolated MCP runtime and advance current pointer
          become: true
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -I
              - "{{ mcp_source }}/scripts/stage-mcp-runtime.py"
              - --source
              - "{{ mcp_source }}"
              - --revision
              - "{{ mcp_sha.stdout }}"
          register: mcp_staging
          changed_when: mcp_activation_needed | bool

        - name: Verify staged runtime before service restart
          become: true
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, /opt/gway-mcp/current/run.py, --check]
          changed_when: false

        - name: Inspect authoritative enrollment ledger
          become: true
          ansible.builtin.stat:
            path: /var/lib/gway-remote/watchtower/ledger.sqlite3
            follow: false
          register: mcp_enrollment_ledger

        - name: Require an existing root-owned enrollment ledger
          ansible.builtin.assert:
            that:
              - mcp_enrollment_ledger.stat.isreg | default(false)
              - not (mcp_enrollment_ledger.stat.islnk | default(false))
              - mcp_enrollment_ledger.stat.pw_name == 'root'
            fail_msg: Enrollment ledger unavailable; refusing to create a separate node registry.

        - name: Publish initial read-only inventory from the authoritative ledger
          become: true
          ansible.builtin.command:
            argv: [/usr/bin/python3, -I, /opt/gway-mcp/current/run.py, node_inventory, --publish]
          changed_when: false

        - name: Install read-only Ansible dynamic enrollment inventory helper
          become: true
          ansible.builtin.copy:
            src: "{{ mcp_source }}/scripts/gway-enrolled-inventory"
            dest: /usr/local/sbin/gway-enrolled-inventory
            owner: root
            group: root
            mode: '0755'

        - name: Install periodic inventory export unit
          become: true
          ansible.builtin.copy:
            src: "{{ mcp_source }}/deploy/mcp-bearer/gway-mcp-inventory-refresh.service"
            dest: /etc/systemd/system/gway-mcp-inventory-refresh.service
            owner: root
            group: root
            mode: '0644'
          register: mcp_inventory_unit

        - name: Install periodic inventory export timer
          become: true
          ansible.builtin.copy:
            src: "{{ mcp_source }}/deploy/mcp-bearer/gway-mcp-inventory-refresh.timer"
            dest: /etc/systemd/system/gway-mcp-inventory-refresh.timer
            owner: root
            group: root
            mode: '0644'
          register: mcp_inventory_timer

        - name: Reload systemd for inventory unit and timer
          become: true
          ansible.builtin.systemd:
            daemon_reload: true
          when: mcp_inventory_unit.changed or mcp_inventory_timer.changed

        - name: Enable only the read-only inventory refresh timer
          become: true
          ansible.builtin.systemd:
            name: gway-mcp-inventory-refresh.timer
            enabled: true
            state: started

        - name: Verify dynamic inventory can read registered hosts
          # The inventory lives beneath /var/lib/gway-mcp-auth (0750).
          # Authenticate via Ansible's existing sudo boundary instead of
          # granting the operator access to the bearer credential directory.
          become: true
          ansible.builtin.command:
            argv: [/usr/local/sbin/gway-enrolled-inventory, --list]
          changed_when: false
          register: mcp_ansible_nodes

        - name: Validate Ansible export has a single enrolled-node group
          ansible.builtin.assert:
            that:
              - (mcp_ansible_nodes.stdout | from_json).gway_enrolled.hosts is defined

        - name: Install only the reviewed OAuth link service unit
          become: true
          ansible.builtin.copy:
            src: "{{ mcp_source }}/deploy/mcp-bearer/gway-mcp-link.service"
            dest: /etc/systemd/system/gway-mcp-link.service
            owner: root
            group: root
            mode: '0644'
          register: mcp_unit_update

        - name: Reload systemd when the OAuth unit changed
          become: true
          ansible.builtin.systemd:
            daemon_reload: true
          when: mcp_unit_update.changed

        - name: Provision isolated private MCP execution state (no activation)
          become: true
          ansible.builtin.file:
            path: /var/lib/gway-mcp-exec
            state: directory
            owner: gway-mcp-gateway
            group: gway-mcp-read
            mode: '0700'

        - name: Install narrowly writable MCP gateway systemd unit
          become: true
          ansible.builtin.copy:
            src: "{{ mcp_source }}/deploy/mcp-bearer/gway-mcp-gateway.service"
            dest: /etc/systemd/system/gway-mcp-gateway.service
            owner: root
            group: root
            mode: '0644'
          register: mcp_exec_gateway_unit

        - name: Reload systemd when MCP gateway unit changed
          become: true
          ansible.builtin.systemd:
            daemon_reload: true
          when: mcp_exec_gateway_unit.changed

        - name: Restart the dedicated MCP gateway for new protocol code
          become: true
          ansible.builtin.systemd:
            name: gway-mcp-gateway.service
            state: restarted
          when: mcp_gateway_activation_needed | bool or mcp_exec_gateway_unit.changed

        - name: Verify gateway is reachable only on its existing loopback listener
          ansible.builtin.uri:
            url: http://127.0.0.1:19010/mcp
            method: GET
            status_code: 405
            timeout: 8
          register: mcp_gateway_check
          retries: 5
          delay: 1
          until: mcp_gateway_check.status == 405
          changed_when: false

        - name: Restart only the dedicated OAuth link on a new release
          become: true
          ansible.builtin.systemd:
            name: "{{ mcp_unit }}"
            state: restarted
          when: mcp_activation_needed | bool

        - name: Confirm OAuth service health on loopback
          ansible.builtin.uri:
            url: http://127.0.0.1:19012/.well-known/oauth-authorization-server
            method: GET
            status_code: 200
            return_content: true
            timeout: 8
          register: mcp_discovery
          retries: 5
          delay: 1
          until: mcp_discovery.status == 200
          changed_when: false

        - name: Verify expected issuer and PKCE metadata
          ansible.builtin.assert:
            that:
              - mcp_discovery.json.issuer == 'https://remote.arthexis.com'
              - mcp_discovery.json.authorization_response_iss_parameter_supported | bool
              - "'S256' in mcp_discovery.json.code_challenge_methods_supported"
      rescue:
        - name: Restore previous pointer atomically if activation failed
          become: true
          ansible.builtin.shell: |
            set -eu
            cd /opt/gway-mcp
            rm -f .mcp-rollback-new
            ln -s "{{ mcp_original_target.stdout }}" .mcp-rollback-new
            mv -Tf .mcp-rollback-new current
          args:
            executable: /bin/sh
          when: mcp_original_target.stdout is match('^releases/[0-9a-f]{40}$')

        - name: Restore original OAuth service unit exactly
          become: true
          ansible.builtin.copy:
            content: "{{ mcp_original_unit.content | b64decode }}"
            dest: /etc/systemd/system/gway-mcp-link.service
            owner: root
            group: root
            mode: '0644'
          no_log: true

        - name: Restart previous private gateway after release rollback
          become: true
          ansible.builtin.systemd:
            name: gway-mcp-gateway.service
            state: restarted
          when: mcp_gateway_activation_needed | bool

        - name: Restart existing OAuth link after rollback
          become: true
          ansible.builtin.systemd:
            name: "{{ mcp_unit }}"
            state: restarted
            daemon_reload: true
          when: mcp_activation_needed | bool

        - name: Stop on failed MCP release activation
          ansible.builtin.fail:
            msg: MCP gateway or OAuth health validation failed; restored the previous selected release.
