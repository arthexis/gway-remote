---
# Activate ONLY the reviewed mobile Feed route on an already-provisioned
# Watchtower HTTPS gateway. Never create a vhost or change credentials.
- name: Converge bounded mobile Activity Feed proxy
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    feed_gateway_snippet: /etc/nginx/snippets/gway-remote-locations.conf
    feed_gateway_vhost: /etc/nginx/sites-enabled/remote.arthexis.com
    feed_gateway_route: |
      # Exact read-only mobile Feed; existing mobile auth is checked over WireGuard.
      location = /api/feed/events {
          limit_except POST { deny all; }
          client_max_body_size 16k;
          proxy_pass http://127.0.0.1:19010;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header X-Gway-Feed-Principal $http_x_gway_feed_principal;
          proxy_connect_timeout 3s;
          proxy_read_timeout 8s;
      }
      location = /api/v1/feed/events {
          limit_except GET { deny all; }
          proxy_pass http://127.0.0.1:19010;
          proxy_set_header Authorization $http_authorization;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_connect_timeout 3s;
          proxy_read_timeout 8s;
          proxy_buffering off;
      }
  tasks:
    - name: Require an existing, non-symlink GWay Remote gateway snippet
      become: true
      ansible.builtin.stat:
        path: "{{ feed_gateway_snippet }}"
        follow: false
      register: feed_gateway_snippet_stat

    - name: Refuse first-time HTTPS provisioning or unrelated snippet
      ansible.builtin.assert:
        that:
          - feed_gateway_snippet_stat.stat.isreg | default(false)
          - not (feed_gateway_snippet_stat.stat.islnk | default(false))
          - feed_gateway_snippet_stat.stat.pw_name == 'root'
        fail_msg: Existing root-owned GWay Remote HTTPS snippet is required.

    - name: Read existing GWay Remote snippet for exact rollback
      become: true
      ansible.builtin.slurp:
        src: "{{ feed_gateway_snippet }}"
      register: feed_gateway_original
      no_log: true

    - name: Require expected existing mobile API routes
      ansible.builtin.assert:
        that:
          - "'location = /api/v1/execute {' in (feed_gateway_original.content | b64decode)"
          - "'proxy_pass http://10.90.0.2:8765/api/v1/execute;' in (feed_gateway_original.content | b64decode)"
          - "'location = /api/v1/health {' in (feed_gateway_original.content | b64decode)"
        fail_msg: The HTTPS snippet does not match an already-provisioned GWay Remote gateway.

    - name: Reject an unmanaged duplicate mobile Feed route
      ansible.builtin.assert:
        that:
          - >-
            ('location = /api/v1/feed/events {' not in (feed_gateway_original.content | b64decode)
             and 'location = /api/feed/events {' not in (feed_gateway_original.content | b64decode))
            or '# BEGIN GWAY MOBILE ACTIVITY FEED' in
            (feed_gateway_original.content | b64decode)
        fail_msg: mobile Feed route exists without managed markers; review before deployment.

    - name: Verify existing TLS vhost includes the reviewed snippet
      become: true
      ansible.builtin.slurp:
        src: "{{ feed_gateway_vhost }}"
      register: feed_gateway_site
      no_log: true

    - name: Reject unexpected TLS vhost arrangement
      ansible.builtin.assert:
        that:
          - "'include /etc/nginx/snippets/gway-remote-locations.conf;' in (feed_gateway_site.content | b64decode)"
        fail_msg: The existing HTTPS vhost must explicitly include the GWay Remote snippet.

    - name: Verify Nginx is healthy before any edit
      become: true
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    - name: Update only the managed Feed route with rollback on errors
      block:
        - name: Add bounded GET-only Feed location to existing proxy snippet
          become: true
          ansible.builtin.blockinfile:
            path: "{{ feed_gateway_snippet }}"
            marker: "# {mark} GWAY MOBILE ACTIVITY FEED"
            block: "{{ feed_gateway_route }}"
            create: false
          register: feed_gateway_change

        - name: Verify the new complete Nginx configuration
          become: true
          ansible.builtin.command:
            argv: [nginx, -t]
          changed_when: false

        - name: Reload HTTPS gateway only if its Feed route changed
          become: true
          ansible.builtin.systemd:
            name: nginx.service
            state: reloaded
          when: feed_gateway_change.changed

        - name: Verify producer ingress denies anonymous publication
          ansible.builtin.uri:
            url: https://remote.arthexis.com/api/feed/events
            method: POST
            follow_redirects: none
            status_code: 401
            timeout: 8
            use_proxy: false
            validate_certs: true
          changed_when: false

        - name: Verify the live HTTPS route rejects unauthenticated requests
          ansible.builtin.uri:
            url: https://remote.arthexis.com/api/v1/feed/events
            method: GET
            follow_redirects: none
            status_code: 401
            timeout: 8
            use_proxy: false
            validate_certs: true
          changed_when: false

      rescue:
        - name: Restore the exact original proxy snippet
          become: true
          ansible.builtin.copy:
            content: "{{ feed_gateway_original.content | b64decode }}"
            dest: "{{ feed_gateway_snippet }}"
            owner: root
            group: root
            mode: '0644'
          no_log: true

        - name: Validate restored Nginx configuration
          become: true
          ansible.builtin.command:
            argv: [nginx, -t]
          changed_when: false

        - name: Reload the restored existing gateway
          become: true
          ansible.builtin.systemd:
            name: nginx.service
            state: reloaded

        - name: Fail rather than leave a partial proxy rollout
          ansible.builtin.fail:
            msg: mobile Feed proxy activation failed; previous Nginx snippet restored.
