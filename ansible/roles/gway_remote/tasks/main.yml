---
- name: Inspect existing CLI
  ansible.builtin.stat:
    path: /usr/local/bin/gway-remote
  register: gway_remote_cli

- name: Create installation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ gway_remote_install_root }}"
    - "{{ gway_remote_install_root }}/scripts"

- name: Copy application package
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../gway_remote/"
    dest: "{{ gway_remote_install_root }}/gway_remote/"
    owner: root
    group: root
    mode: preserve
  register: gway_remote_source

- name: Copy CLI installer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/install-cli.sh"
    dest: "{{ gway_remote_install_root }}/scripts/install-cli.sh"
    owner: root
    group: root
    mode: "0755"
  register: gway_remote_installer

- name: Install system-wide executable
  ansible.builtin.command:
    cmd: "sh {{ gway_remote_install_root }}/scripts/install-cli.sh"
  when: gway_remote_source.changed or gway_remote_installer.changed or not gway_remote_cli.stat.exists

- name: Verify read-only status JSON as runner user
  ansible.builtin.command:
    cmd: /usr/local/bin/gway-remote status --json
  become_user: "{{ gway_remote_runner_user }}"
  changed_when: false
  register: gway_remote_status

- name: Verify status schema
  ansible.builtin.assert:
    that:
      - (gway_remote_status.stdout | from_json).schema == 'gway-remote/status/v1'

- name: Install fixed-purpose public sound helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/gway-promote-sound"
    dest: /usr/local/sbin/gway-promote-sound
    owner: root
    group: root
    mode: "0755"

- name: Restrict public sound helper sudo to appliance runner
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gway-remote-public-sound
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
    content: |
      {{ gway_remote_runner_user }} ALL=(root) NOPASSWD: /usr/local/sbin/gway-promote-sound *

- name: Create durable watch state directory
  ansible.builtin.file:
    path: "/home/{{ gway_remote_runner_user }}/.local/state/gway-remote"
    state: directory
    owner: "{{ gway_remote_runner_user }}"
    group: "{{ gway_remote_runner_user }}"
    mode: "0700"

- name: Install appliance watch systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - gway-remote-watch.service
    - gway-remote-watch.timer
  register: watch_units

- name: Reload systemd for new appliance watch units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: watch_units.changed

- name: Enable periodic GWay Remote appliance watch
  ansible.builtin.systemd_service:
    name: gway-remote-watch.timer
    enabled: true
    state: started

- name: Create private GitHub Health configuration directory
  ansible.builtin.file:
    path: "/home/{{ gway_remote_runner_user }}/.config/gway-remote"
    state: directory
    owner: "{{ gway_remote_runner_user }}"
    group: "{{ gway_remote_runner_user }}"
    mode: "0700"

- name: Inspect externally provisioned GitHub Health token configuration
  ansible.builtin.stat:
    path: "/home/{{ gway_remote_runner_user }}/.config/gway-remote/github-health.env"
  register: github_health_token_config

- name: Install GitHub Health collector systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - gway-remote-health.service
    - gway-remote-health.timer
  register: github_health_units

- name: Reload systemd for GitHub Health units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: github_health_units.changed

- name: Enable GitHub Health timer only when private token configuration exists
  ansible.builtin.systemd_service:
    name: gway-remote-health.timer
    enabled: true
    state: started
  when: github_health_token_config.stat.exists

- name: Keep GitHub Health timer disabled until private token is provisioned
  ansible.builtin.systemd_service:
    name: gway-remote-health.timer
    enabled: false
    state: stopped
  when: not github_health_token_config.stat.exists
