---
# Opt-in registration-only policy staging. No automatic source enrollment or restart.
- name: Validate MCP source registrations
  ansible.builtin.assert:
    that:
      - gway_mcp_sources is sequence
      - gway_mcp_sources is not string
      - gway_mcp_sources | length <= 16
      - (gway_mcp_sources | map(attribute='source_id') | list | unique | length) == (gway_mcp_sources | length)
    fail_msg: "Invalid MCP source list"

- name: Validate each pinned MCP provider
  ansible.builtin.assert:
    that:
      - item.keys() | list | sort == ['argv', 'enabled', 'executable', 'revision', 'run_as', 'source_id']
      - item.source_id is match('^[a-z][a-z0-9_]{1,39}$')
      - item.revision is match('^[0-9a-f]{40}$')
      - item.executable is match('^/[^/]+')
      - "'..' not in item.executable.split('/')"
      - item.argv is sequence
      - item.argv is not string
      - item.argv | length > 0
      - item.argv[0] == item.executable
      - item.run_as is match('^[a-z][a-z0-9_]{1,39}$')
      - item.enabled is boolean
  loop: "{{ gway_mcp_sources }}"
  loop_control:
    label: "{{ item.source_id | default('invalid') }}"

- name: Create protected MCP policy directory
  ansible.builtin.file:
    path: /etc/gway-mcp-gateway
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Inspect existing policy without following symlinks
  ansible.builtin.stat:
    path: /etc/gway-mcp-gateway/sources.json
    follow: false
  register: gway_mcp_existing

- name: Refuse untrusted existing policy
  ansible.builtin.assert:
    that:
      - not (gway_mcp_existing.stat.islnk | default(false))
      - not (gway_mcp_existing.stat.exists | default(false)) or (gway_mcp_existing.stat.isreg | default(false))
      - not (gway_mcp_existing.stat.exists | default(false)) or gway_mcp_existing.stat.pw_name == 'root'
      - not (gway_mcp_existing.stat.exists | default(false)) or ('2' not in gway_mcp_existing.stat.mode[-2:] and '3' not in gway_mcp_existing.stat.mode[-2:] and '6' not in gway_mcp_existing.stat.mode[-2:] and '7' not in gway_mcp_existing.stat.mode[-2:])

- name: Render canonical MCP policy v2
  ansible.builtin.set_fact:
    gway_mcp_desired_policy: |
      {% set ns = namespace(entries=[]) %}
      {% for source in gway_mcp_sources | sort(attribute='source_id') %}
      {% set ns.entries = ns.entries + [{'registration': source}] %}
      {% endfor %}
      {{ {'version': 2, 'sources': ns.entries} | to_json(sort_keys=True) }}

- name: Install registration-only MCP policy
  ansible.builtin.copy:
    dest: /etc/gway-mcp-gateway/sources.json
    owner: root
    group: root
    mode: '0644'
    content: "{{ gway_mcp_desired_policy }}"
  register: gway_mcp_policy_staged

- name: Validate staged policy with installed package parser
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - 'import hashlib,sys; from gway_remote.mcp_source_policy import load_source_policy; p=sys.argv[1]; d=hashlib.sha256(open(p,"rb").read()).hexdigest(); load_source_policy(p,expected_sha256=d); print(d)'
      - /etc/gway-mcp-gateway/sources.json
  environment:
    PYTHONPATH: "{{ gway_remote_install_root }}"
  changed_when: false
  register: gway_mcp_policy_verified

- name: Compute staged policy checksum
  ansible.builtin.stat:
    path: /etc/gway-mcp-gateway/sources.json
    checksum_algorithm: sha256
  register: gway_mcp_policy_checksum

- name: Assert verified digest
  ansible.builtin.assert:
    that:
      - gway_mcp_policy_verified.stdout == gway_mcp_policy_checksum.stat.checksum


# Compatibility migration: each administratively installed source becomes an
# independently discoverable manifest. No tools or source approvals are pinned.
- name: Create administrative provider manifest directory
  ansible.builtin.file:
    path: /etc/gway-mcp-providers
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Publish installed MCP provider manifests atomically
  ansible.builtin.copy:
    dest: "/etc/gway-mcp-providers/{{ item.source_id }}.json"
    owner: root
    group: root
    mode: '0644'
    content: "{{ {'source_id': item.source_id, 'revision': item.revision, 'executable': item.executable, 'argv': item.argv} | to_json(sort_keys=True) }}\n"
  loop: "{{ gway_mcp_sources }}"
  loop_control:
    label: "{{ item.source_id }}"

- name: Validate installed provider discovery
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "from gway_remote.mcp_installed_providers import discover_installed_providers; print([r.source_id for r in discover_installed_providers()])"
  environment:
    PYTHONPATH: "{{ gway_remote_install_root }}"
  changed_when: false

