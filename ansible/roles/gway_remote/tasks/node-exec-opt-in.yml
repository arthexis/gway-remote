---
# Explicit opt-in ONLY. Never included by the default role.
# The playbook invoking this task must run as root via normal Ansible become.
# The SSH login remains the installer account; no auxiliary Unix identity.
- name: Require explicit executor opt-in and declared installer identity
  ansible.builtin.assert:
    that:
      - gway_remote_executor_opt_in | default(false) | bool
      - gway_remote_runner_user is defined
      - gway_remote_runner_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - gway_remote_runner_user != 'root'
      - gway_remote_runner_uid is defined
      - (gway_remote_runner_uid | int) > 0
      - gway_remote_exec_public_key is defined
      - gway_remote_exec_public_key is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,2}$')
    fail_msg: Remote executor opt-in requires the nonroot installer identity and dedicated public key

# These commands run as the remote SSH/local connection identity, not the
# Ansible controller and not the escalated root account. A differing connection
# login is a hard stop, even when getent finds the declared account.
- name: Read the connecting installer's login on the managed node
  ansible.builtin.command:
    argv: [/usr/bin/id, -un]
  become: false
  changed_when: false
  register: gway_remote_exec_connection_user

- name: Read the connecting installer's UID on the managed node
  ansible.builtin.command:
    argv: [/usr/bin/id, -u]
  become: false
  changed_when: false
  register: gway_remote_exec_connection_uid

- name: Refuse a remote connection that is not the declared installer
  ansible.builtin.assert:
    that:
      - gway_remote_exec_connection_user.stdout == gway_remote_runner_user
      - (gway_remote_exec_connection_uid.stdout | int) == (gway_remote_runner_uid | int)
      - (gway_remote_exec_connection_uid.stdout | int) > 0
    fail_msg: Managed-node connection UID or login differs from the installer

# The worker independently reads this immutable, root-controlled node policy.
# Never create or silently switch it during SSH key opt-in.
- name: Inspect installed node executor identity directory
  ansible.builtin.stat:
    path: /etc/gway-remote
    follow: false
  register: gway_remote_exec_policy_dir

- name: Inspect installed node executor identity record
  ansible.builtin.stat:
    path: /etc/gway-remote/executor-identity.json
    follow: false
  register: gway_remote_exec_policy

- name: Refuse missing or unsafe installed executor identity
  ansible.builtin.assert:
    that:
      - gway_remote_exec_policy_dir.stat.isdir | default(false)
      - not (gway_remote_exec_policy_dir.stat.islnk | default(false))
      - gway_remote_exec_policy_dir.stat.pw_name == 'root'
      - ((gway_remote_exec_policy_dir.stat.mode | int(base=8)) % 8) not in [2, 3, 6, 7]
      - (((gway_remote_exec_policy_dir.stat.mode | int(base=8)) // 8) % 8) not in [2, 3, 6, 7]
      - gway_remote_exec_policy.stat.isreg | default(false)
      - not (gway_remote_exec_policy.stat.islnk | default(false))
      - gway_remote_exec_policy.stat.pw_name == 'root'
      - ((gway_remote_exec_policy.stat.mode | int(base=8)) % 8) not in [2, 3, 6, 7]
      - (((gway_remote_exec_policy.stat.mode | int(base=8)) // 8) % 8) not in [2, 3, 6, 7]
      - (gway_remote_exec_policy.stat.size | int) <= 1024
    fail_msg: Existing root-owned node executor identity is missing or unsafe

- name: Read existing node executor identity without changing it
  ansible.builtin.slurp:
    src: /etc/gway-remote/executor-identity.json
  register: gway_remote_exec_identity_record

- name: Refuse installer mismatch with existing node worker identity
  ansible.builtin.assert:
    that:
      - "(gway_remote_exec_identity_record.content | b64decode | from_json) == {'user': gway_remote_runner_user}"
    fail_msg: Installed node executor identity differs from this installer; manual migration required

- name: Resolve installer account without creating or switching users
  ansible.builtin.getent:
    database: passwd
    key: "{{ gway_remote_runner_user }}"

- name: Require installer-owned existing SSH directory
  ansible.builtin.stat:
    path: "{{ getent_passwd[gway_remote_runner_user][4] }}/.ssh"
    follow: false
  register: gway_remote_exec_ssh_dir

- name: Reject missing or unsafe SSH directory
  ansible.builtin.assert:
    that:
      - gway_remote_exec_ssh_dir.stat.isdir | default(false)
      - not (gway_remote_exec_ssh_dir.stat.islnk | default(false))
      - gway_remote_exec_ssh_dir.stat.pw_name == gway_remote_runner_user
      - (getent_passwd[gway_remote_runner_user][1] | int) == (gway_remote_runner_uid | int)
      - ((gway_remote_exec_ssh_dir.stat.mode | int(base=8)) % 8) == 0
      - (((gway_remote_exec_ssh_dir.stat.mode | int(base=8)) // 8) % 8) == 0

# Never repurpose an existing administrative SSH public key for executor login.
# A nonexclusive authorized_key update can otherwise rewrite its options.
- name: Inspect existing installer authorized keys before adding executor key
  ansible.builtin.stat:
    path: "{{ getent_passwd[gway_remote_runner_user][4] }}/.ssh/authorized_keys"
    follow: false
  register: gway_remote_exec_existing_keys

- name: Refuse missing ownership or unsafe authorized_keys metadata
  ansible.builtin.assert:
    that:
      - not (gway_remote_exec_existing_keys.stat.islnk | default(false))
      - not (gway_remote_exec_existing_keys.stat.exists | default(false)) or (gway_remote_exec_existing_keys.stat.isreg | default(false))
      - not (gway_remote_exec_existing_keys.stat.exists | default(false)) or gway_remote_exec_existing_keys.stat.pw_name == gway_remote_runner_user
      - not (gway_remote_exec_existing_keys.stat.exists | default(false)) or ((gway_remote_exec_existing_keys.stat.mode | int(base=8)) % 8) not in [2, 3, 6, 7]
      - not (gway_remote_exec_existing_keys.stat.exists | default(false)) or (((gway_remote_exec_existing_keys.stat.mode | int(base=8)) // 8) % 8) not in [2, 3, 6, 7]
    fail_msg: Existing installer authorized_keys is not safe for a dedicated executor key

- name: Reject executor public key collision with any unrestricted existing key
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os
        import sys
        from pathlib import Path

        path, supplied = sys.argv[1:3]
        key_parts = supplied.split()
        if len(key_parts) != 2 or key_parts[0] != "ssh-ed25519":
            sys.exit(2)
        # Root Ansible needs read access only; fail closed on symlinks or
        # unusual encodings. We do not rewrite an administrator's key.
        try:
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
        except FileNotFoundError:
            sys.exit(0)
        expected = 'restrict,command="/usr/local/libexec/gway-remote-exec-protocol-v1"'
        with os.fdopen(fd, "r", encoding="ascii") as authorized:
            for line in authorized:
                fields = line.strip().split()
                if not fields or fields[0].startswith("#"):
                    continue
                for index, field in enumerate(fields):
                    if field != "ssh-ed25519" or index + 1 >= len(fields):
                        continue
                    if fields[index + 1] == key_parts[1]:
                        if " ".join(fields[:index]) != expected:
                            sys.exit(1)
                        break
      - "{{ getent_passwd[gway_remote_runner_user][4] }}/.ssh/authorized_keys"
      - "{{ gway_remote_exec_public_key }}"
  changed_when: false
  no_log: true

- name: Ensure root-owned libexec directory exists before installing forced command
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install reviewed fixed-command entrypoint only during explicit opt-in
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/node-exec-forced-command.py"
    dest: /usr/local/libexec/gway-remote-exec-protocol-v1
    owner: root
    group: root
    mode: '0755'

- name: Require installed root-owned forced-command entrypoint before authorizing key
  ansible.builtin.stat:
    path: /usr/local/libexec/gway-remote-exec-protocol-v1
    follow: false
  register: gway_remote_exec_entrypoint

- name: Deny SSH key installation until forced-command entrypoint is safe
  ansible.builtin.assert:
    that:
      - gway_remote_exec_entrypoint.stat.isreg | default(false)
      - not (gway_remote_exec_entrypoint.stat.islnk | default(false))
      - gway_remote_exec_entrypoint.stat.pw_name == 'root'
      - gway_remote_exec_entrypoint.stat.mode == '0755'
    fail_msg: Forced-command executable unavailable or unsafe

# Key-specific forced command; administrative SSH keys remain untouched.
- name: Install dedicated restricted executor key for installer
  ansible.posix.authorized_key:
    user: "{{ gway_remote_runner_user }}"
    key: "{{ gway_remote_exec_public_key }}"
    key_options: 'restrict,command="/usr/local/libexec/gway-remote-exec-protocol-v1"'
    exclusive: false
    manage_dir: false
    state: present
