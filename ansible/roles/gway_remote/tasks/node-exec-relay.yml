---
# B2b-3: opt-in SSH protocol identity on a named gway node only.
# Never copy a private key here. No general Watchtower shell.
- name: Require dedicated audited relay public key
  ansible.builtin.assert:
    that:
      - (ansible_hostname | default('')) is match('^gway-[0-9]+
      - gway_exec_relay_public_key is defined
      - (gway_exec_relay_public_key | string) is match('^ssh-ed25519 [A-Za-z0-9+/=]+( [A-Za-z0-9_.@-]+)?$')
    fail_msg: Explicit ed25519 relay public key and enrolled gway node identity required.

# Install SSH's enforced restrictions BEFORE account creation.
- name: Install dedicated SSHD Match block with forced protocol only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/40-gway-exec-relay.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      Match User gway-relay
          AuthenticationMethods publickey
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PermitTTY no
          DisableForwarding yes
          AllowAgentForwarding no
          AllowTcpForwarding no
          X11Forwarding no
          PermitTunnel no
          AuthorizedKeysFile /var/lib/gway-relay/.ssh/authorized_keys
          ForceCommand /usr/bin/sudo -n -u {{ gway_remote_exec_run_user }} /usr/bin/env PYTHONPATH={{ gway_remote_install_root }} GWAY_MCP_SOURCE_POLICY=/etc/gway-mcp-gateway/sources.json /usr/bin/python3 -m gway_remote.node_exec_protocol
    validate: /usr/sbin/sshd -t -f %s
  register: gway_relay_sshd_conf

# The copy validator checks the isolated Match fragment. Validate the full
# system sshd configuration too, before any service reload.
- name: Validate effective SSH daemon configuration before relay reload
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false

- name: Reload SSH daemon with forced-command policy
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  when: gway_relay_sshd_conf.changed

- name: Create restricted dedicated relay group
  ansible.builtin.group:
    name: gway-relay
    system: true
    state: present

- name: Create locked relay account without supplementary groups
  ansible.builtin.user:
    name: gway-relay
    group: gway-relay
    groups: ""
    append: false
    home: /var/lib/gway-relay
    create_home: false
    shell: /bin/sh
    password_lock: true
    system: true
    state: present

# Root-owned, nonwritable by gway-relay: no self-managed keys.
- name: Create root-owned relay key directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /var/lib/gway-relay
    - /var/lib/gway-relay/.ssh

- name: Install single SSH key for fixed-command relay
  ansible.builtin.copy:
    dest: /var/lib/gway-relay/.ssh/authorized_keys
    owner: root
    group: root
    mode: "0644"
    content: |
      restrict,no-agent-forwarding,no-port-forwarding,no-pty,no-user-rc,no-X11-forwarding {{ gway_exec_relay_public_key }}

- name: Permit ONLY the fixed non-root protocol transition
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gway-exec-relay
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      gway-relay ALL=({{ gway_remote_exec_run_user }}) NOPASSWD: /usr/bin/env PYTHONPATH={{ gway_remote_install_root }} GWAY_MCP_SOURCE_POLICY=/etc/gway-mcp-gateway/sources.json /usr/bin/python3 -m gway_remote.node_exec_protocol

- name: Verify relay account has no supplementary groups
  ansible.builtin.command:
    argv: [id, -nG, gway-relay]
  register: gway_relay_groups
  changed_when: false

- name: Enforce relay group isolation
  ansible.builtin.assert:
    that:
      - gway_relay_groups.stdout.split() == ['gway-relay']
