---
# #367: identity is node-local Ansible policy, never a field in MCP request.
# Existing locked account remains provisioned for rollback and other nodes.
- name: Validate the explicit executor identity override
  ansible.builtin.assert:
    that:
      - gway_remote_exec_run_user is string
      - gway_remote_exec_run_user | length > 0
      - gway_remote_exec_run_user != 'root'
      - gway_remote_exec_run_user is match('^[a-z_][a-z0-9_-]*
      - gway_remote_exec_run_user == (gway_remote_exec_user | default('gway-exec')) or gway_remote_exec_run_user == gway_remote_runner_user
    fail_msg: Executor must be the existing isolated executor or the installing operator, never root.

- name: Look up selected existing executor account
  ansible.builtin.getent:
    database: passwd
    key: "{{ gway_remote_exec_run_user }}"

- name: Verify selected executor user manager exists
  ansible.builtin.stat:
    path: "/run/user/{{ getent_passwd[gway_remote_exec_run_user][1] }}/bus"
    follow: false
  register: exec_selected_bus

- name: Refuse cutover if selected executor cannot launch bounded user jobs
  ansible.builtin.assert:
    that:
      - exec_selected_bus.stat.issock | default(false)
      - exec_selected_bus.stat.pw_name == gway_remote_exec_run_user
    fail_msg: Selected executor user bus is unavailable; do not change the live relay identity.

- name: Prepare separate private operator job storage without modifying legacy ledger
  ansible.builtin.file:
    path: /var/lib/gway-remote-exec-arthe
    state: directory
    owner: arthe
    group: arthe
    mode: '0700'
    follow: false
  when: gway_remote_exec_run_user == 'arthe'

- name: Ensure existing node executor jobs have drained before identity switch
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - "PYTHONPATH={{ gway_remote_install_root }}"
      - /usr/bin/python3
      - "{{ playbook_dir }}/../scripts/verify-exec-cutover.py"
      - "{{ gway_remote_exec_run_user }}"
  changed_when: false

- name: Ensure node-local identity configuration directory exists
  ansible.builtin.file:
    path: /etc/gway-remote
    state: directory
    owner: root
    group: root
    mode: '0755'
    follow: false

- name: Inspect any existing executor identity policy
  ansible.builtin.stat:
    path: /etc/gway-remote/executor-identity.json
    follow: false
  register: exec_identity_old

- name: Refuse pre-existing unsafe identity policy
  ansible.builtin.assert:
    that:
      - not (exec_identity_old.stat.islnk | default(false))
      - not exec_identity_old.stat.exists or (exec_identity_old.stat.isreg and exec_identity_old.stat.pw_name == 'root' and exec_identity_old.stat.mode in ['0644', '0600'])
  when: exec_identity_old.stat.exists | default(false)

- name: Capture original identity policy for rollback
  ansible.builtin.slurp:
    src: /etc/gway-remote/executor-identity.json
  register: exec_identity_original
  when: exec_identity_old.stat.exists | default(false)

- name: Inspect previously opted-in restricted SSH relay
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /etc/ssh/sshd_config.d/40-gway-exec-relay.conf
    - /etc/sudoers.d/gway-exec-relay
  register: exec_relay_files

- name: Reject incomplete or symlinked relay provisioning
  ansible.builtin.assert:
    that:
      - (exec_relay_files.results[0].stat.exists | default(false)) == (exec_relay_files.results[1].stat.exists | default(false))
      - not (exec_relay_files.results[0].stat.islnk | default(false))
      - not (exec_relay_files.results[1].stat.islnk | default(false))
      - not (exec_relay_files.results[0].stat.exists | default(false)) or (exec_relay_files.results[0].stat.isreg and exec_relay_files.results[0].stat.pw_name == 'root')
      - not (exec_relay_files.results[1].stat.exists | default(false)) or (exec_relay_files.results[1].stat.isreg and exec_relay_files.results[1].stat.pw_name == 'root')
  vars:
    relay_present: "{{ exec_relay_files.results[0].stat.exists | default(false) }}"

- name: Capture existing restricted relay SSH configuration
  ansible.builtin.slurp:
    src: /etc/ssh/sshd_config.d/40-gway-exec-relay.conf
  register: exec_relay_sshd_original
  when: exec_relay_files.results[0].stat.exists | default(false)

- name: Capture existing exact sudoers authorization
  ansible.builtin.slurp:
    src: /etc/sudoers.d/gway-exec-relay
  register: exec_relay_sudo_original
  when: exec_relay_files.results[1].stat.exists | default(false)

- name: Verify existing SSH and sudoers relay identities agree before cutover
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ playbook_dir }}/../scripts/verify-exec-relay-policy.py"
  changed_when: false
  when: exec_relay_files.results[0].stat.exists | default(false)

- name: Activate selected execution identity and update only existing relay
  block:
    - name: Install root-controlled selected executor identity
      ansible.builtin.copy:
        dest: /etc/gway-remote/executor-identity.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {"user": {{ gway_remote_exec_run_user | to_json }}}

    - name: Update narrowly permitted relay protocol target account
      ansible.builtin.copy:
        dest: /etc/sudoers.d/gway-exec-relay
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
        content: |
          gway-relay ALL=({{ gway_remote_exec_run_user }}) NOPASSWD: /usr/bin/env PYTHONPATH=/opt/gway-remote GWAY_MCP_SOURCE_POLICY=/etc/gway-mcp-gateway/sources.json /usr/bin/python3 -m gway_remote.node_exec_protocol
      when: exec_relay_files.results[1].stat.exists | default(false)

    - name: Update restricted SSH ForceCommand without changing other SSH settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/40-gway-exec-relay.conf
        owner: root
        group: root
        mode: '0644'
        content: >-
          {{ (exec_relay_sshd_original.content | b64decode) | regex_replace('(?<=-u )[a-z_][a-z0-9_-]*(?= /usr/bin/env PYTHONPATH=)', gway_remote_exec_run_user) }}
      register: exec_relay_sshd_changed
      when: exec_relay_files.results[0].stat.exists | default(false)

    - name: Verify both live relay policies point to the selected executor
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ playbook_dir }}/../scripts/verify-exec-relay-policy.py"
          - --user
          - "{{ gway_remote_exec_run_user }}"
      changed_when: false
      when: exec_relay_files.results[0].stat.exists | default(false)

    - name: Validate full sshd configuration after changing the forced command
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      changed_when: false
      when: exec_relay_files.results[0].stat.exists | default(false)

    - name: Reload SSH with the selected fixed protocol account
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when:
        - exec_relay_files.results[0].stat.exists | default(false)
        - exec_relay_sshd_changed.changed | default(false)

    - name: Verify selected executor can import the installed worker
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - -H
          - -u
          - "{{ gway_remote_exec_run_user }}"
          - /usr/bin/env
          - "PYTHONPATH={{ gway_remote_install_root }}"
          - /usr/bin/python3
          - -c
          - "from gway_remote.node_exec_worker import require_account; require_account()"
      changed_when: false

  rescue:
    - name: Restore previous restricted relay sudoers
      ansible.builtin.copy:
        dest: /etc/sudoers.d/gway-exec-relay
        content: "{{ exec_relay_sudo_original.content | b64decode }}"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      when: exec_relay_files.results[1].stat.exists | default(false)

    - name: Restore original forced-command SSH configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/40-gway-exec-relay.conf
        content: "{{ exec_relay_sshd_original.content | b64decode }}"
        owner: root
        group: root
        mode: '0644'
      when: exec_relay_files.results[0].stat.exists | default(false)

    - name: Restore previous executor identity configuration
      ansible.builtin.copy:
        dest: /etc/gway-remote/executor-identity.json
        content: "{{ exec_identity_original.content | b64decode }}"
        owner: root
        group: root
        mode: '0644'
      when: exec_identity_old.stat.exists | default(false)

    - name: Remove newly created executor identity configuration on rollback
      ansible.builtin.file:
        path: /etc/gway-remote/executor-identity.json
        state: absent
      when: not (exec_identity_old.stat.exists | default(false))

    - name: Recheck restored SSH/sudoers identity agreement after rollback
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ playbook_dir }}/../scripts/verify-exec-relay-policy.py"
      changed_when: false
      when: exec_relay_files.results[0].stat.exists | default(false)

    - name: Validate SSH after rollback
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -t]
      changed_when: false
      when: exec_relay_files.results[0].stat.exists | default(false)

    - name: Reload SSH after restoring original forced-command identity
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when: exec_relay_files.results[0].stat.exists | default(false)

    - name: Refuse partially switched executor identity
      ansible.builtin.fail:
        msg: Executor identity change failed; previous identity and forced command restored.
)
