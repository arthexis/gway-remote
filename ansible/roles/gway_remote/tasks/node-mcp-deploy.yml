---
# The installed provider manifest is the only deployment registry.
# The authenticated node worker invokes the provider-owned deploy.sh as its
# existing effective UID; that script owns Ansible escalation via become.
# Do not install a second deployment service, sudo grant or root helper.
- name: Inspect existing node execution account
  ansible.builtin.getent:
    database: passwd
    key: "{{ gway_remote_exec_user | default(gway_remote_runner_user) }}"

- name: Provision private node-local deployment receipt directory
  ansible.builtin.file:
    path: /var/lib/gway-mcp-deploy
    state: directory
    owner: "{{ gway_remote_exec_user | default(gway_remote_runner_user) }}"
    group: "{{ gway_remote_exec_user | default(gway_remote_runner_user) }}"
    mode: "0700"

# Retire only the obsolete deployment-specific privilege path. This does not
# touch the existing SSH executor, any other sudo policy or active services.
- name: Inspect installed services before retiring dedicated deployment unit
  ansible.builtin.service_facts:

- name: Disable obsolete dedicated deployment unit if installed
  ansible.builtin.systemd:
    name: gway-remote-deploy.service
    enabled: false
    state: stopped
  when: "'gway-remote-deploy.service' in ansible_facts.services"

- name: Remove obsolete dedicated deployment artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sudoers.d/gway-remote-mcp-deploy
    - /etc/systemd/system/gway-remote-deploy.service
    - /usr/local/libexec/gway-remote-deploy
    - /usr/local/libexec/gway-remote-deploy-receipt.py
  register: gway_legacy_deploy_removed

- name: Reload systemd only when obsolete unit files changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: gway_legacy_deploy_removed.changed
