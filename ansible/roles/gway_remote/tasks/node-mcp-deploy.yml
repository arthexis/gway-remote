---
# Dedicated deployment broker: gway-exec may start one root-owned
# systemd unit. It never gains general sudo or Ansible authority.
- name: Validate deployment operator identity
  ansible.builtin.assert:
    that:
      - gway_remote_runner_user not in ['root', 'gway-exec']
      - (getent_passwd[gway_remote_runner_user][4] | length) > 1

# Resolve the checkout that actually launched this playbook, not a guessed
# ~/Repos location hidden from the unprivileged executor.
- name: Set canonical operator checkout from deploying playbook
  ansible.builtin.set_fact:
    gway_remote_deploy_checkout: "{{ playbook_dir }}/.."

- name: Inspect deployment checkout without following symlinks
  ansible.builtin.stat:
    path: "{{ gway_remote_deploy_checkout }}"
    follow: false
  register: gway_mcp_checkout

- name: Reject missing or symlinked deployment checkout
  ansible.builtin.assert:
    that:
      - gway_mcp_checkout.stat.isdir | default(false)
      - not (gway_mcp_checkout.stat.islnk | default(true))
      - gway_remote_deploy_checkout.startswith('/')

- name: Verify deployment operator can access the Git checkout
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - -C
      - "{{ gway_remote_deploy_checkout }}"
      - rev-parse
      - --show-toplevel
  become: true
  become_user: "{{ gway_remote_runner_user }}"
  changed_when: false

- name: Create deployment receipt directory readable by restricted executor
  ansible.builtin.file:
    path: /var/lib/gway-mcp-deploy
    state: directory
    owner: "{{ gway_remote_runner_user }}"
    group: gway-exec
    mode: "2750"

- name: Ensure root-owned deployment helper directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install fixed operator-owned deployment script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/gway-remote-deploy"
    dest: /usr/local/libexec/gway-remote-deploy
    owner: root
    group: root
    mode: "0755"

- name: Install deployment receipt writer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/gway-remote-deploy-receipt.py"
    dest: /usr/local/libexec/gway-remote-deploy-receipt.py
    owner: root
    group: root
    mode: "0755"

- name: Install dedicated deployment unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/gway-remote-deploy.service
    owner: root
    group: root
    mode: "0644"
    content: "{{ lookup('file', playbook_dir ~ '/../deploy/systemd/gway-remote-deploy.service') | replace('__RUNNER__', gway_remote_runner_user) | replace('__HOME__', getent_passwd[gway_remote_runner_user][4]) | replace('__CHECKOUT__', gway_remote_deploy_checkout) }}"
  register: gway_mcp_deploy_unit

- name: Allow executor to start only the dedicated deployment unit
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gway-remote-mcp-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # One exact action, never an arbitrary shell, unit or systemctl flag.
      gway-exec ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block gway-remote-deploy.service

- name: Install root-owned Odoo deployment entrypoint
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/gway-odoo-deploy"
    dest: /usr/local/libexec/gway-odoo-deploy
    owner: root
    group: root
    mode: "0755"

- name: Install fixed local-only Odoo Ansible recipe
  ansible.builtin.copy:
    dest: /usr/local/libexec/gway-odoo-deploy.yml
    owner: root
    group: root
    mode: "0644"
    content: "{{ lookup('file', playbook_dir ~ '/playbooks/node-odoo-deploy.yml') | replace('__RUNNER__', gway_remote_runner_user) | replace('__GWAY_CHECKOUT__', gway_remote_deploy_checkout) }}"

- name: Install dedicated Odoo deployment unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/gway-odoo-deploy.service
    owner: root
    group: root
    mode: "0644"
    content: "{{ lookup('file', playbook_dir ~ '/../deploy/systemd/gway-odoo-deploy.service') | replace('__RUNNER__', gway_remote_runner_user) | replace('__HOME__', getent_passwd[gway_remote_runner_user][4]) | replace('__CHECKOUT__', gway_remote_deploy_checkout) }}"
  register: gway_mcp_odoo_unit

- name: Allow executor to start only the fixed Odoo unit
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gway-remote-mcp-odoo-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      gway-exec ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block gway-odoo-deploy.service

- name: Reload systemd after changing deployment unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: gway_mcp_deploy_unit.changed or gway_mcp_odoo_unit.changed
