---
# Dedicated deployment broker: gway-exec may start ONE fixed root-owned
# systemd unit; it never receives arbitrary sudo or Ansible authority.
- name: Validate deployment operator identity
  ansible.builtin.assert:
    that:
      - gway_remote_runner_user not in ['root', 'gway-exec']
      - (getent_passwd[gway_remote_runner_user][4] | length) > 1

# The source checkout is the repository containing this Ansible playbook,
# not a guessed ~/Repos directory inaccessible to the executor.
- name: Set canonical operator checkout from deploying playbook
  ansible.builtin.set_fact:
    gway_remote_deploy_checkout: "{{ playbook_dir }}/.."

- name: Verify checkout is a real directory, not a symlink
  ansible.builtin.stat:
    path: "{{ gway_remote_deploy_checkout }}"
    follow: false
  register: gway_mcp_checkout

- name: Reject unavailable or unsafe operator checkout
  ansible.builtin.assert:
    that:
      - gway_mcp_checkout.stat.isdir | default(false)
      - not (gway_mcp_checkout.stat.islnk | default(true))
      - gway_remote_deploy_checkout is match('^/[^\\s\\n]+
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install fixed, operator-executed GWay Remote deployment script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/gway-remote-deploy"
    dest: /usr/local/libexec/gway-remote-deploy
    owner: root
    group: root
    mode: "0755"

- name: Install fixed deployment receipt writer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/gway-remote-deploy-receipt.py"
    dest: /usr/local/libexec/gway-remote-deploy-receipt.py
    owner: root
    group: root
    mode: "0755"

- name: Install dedicated GWay Remote deployment unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/gway-remote-deploy.service
    owner: root
    group: root
    mode: "0644"
    content: "{{ lookup('file', playbook_dir ~ '/../deploy/systemd/gway-remote-deploy.service') | replace('__RUNNER__', gway_remote_runner_user) | replace('__HOME__', getent_passwd[gway_remote_runner_user][4]) | replace('__CHECKOUT__', gway_remote_deploy_checkout) }}"
  register: gway_mcp_deploy_unit

- name: Allow executor to start only the dedicated deployment unit
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gway-remote-mcp-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # One precise action: no shell, editor, systemctl flags or other units.
      gway-exec ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block gway-remote-deploy.service

- name: Reload systemd after changing dedicated deploy unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: gway_mcp_deploy_unit.changed
)

- name: Verify the deployment operator can access its Git checkout
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - -C
      - "{{ gway_remote_deploy_checkout }}"
      - rev-parse
      - --show-toplevel
  become: true
  become_user: "{{ gway_remote_runner_user }}"
  changed_when: false

- name: Create operator-owned, executor-readable deployment receipt directory
  ansible.builtin.file:
    path: /var/lib/gway-mcp-deploy
    state: directory
    owner: "{{ gway_remote_runner_user }}"
    group: gway-exec
    mode: "2750"  # setgid: receipts inherit gway-exec group for read-only status

- name: Ensure root-owned deploy helper directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install fixed, operator-executed GWay Remote deployment script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/gway-remote-deploy"
    dest: /usr/local/libexec/gway-remote-deploy
    owner: root
    group: root
    mode: "0755"

- name: Install dedicated GWay Remote deployment unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/gway-remote-deploy.service
    owner: root
    group: root
    mode: "0644"
    content: "{{ lookup('file', playbook_dir ~ '/../deploy/systemd/gway-remote-deploy.service') | replace('__RUNNER__', gway_remote_runner_user) | replace('__HOME__', getent_passwd[gway_remote_runner_user][4]) }}"
  register: gway_mcp_deploy_unit

- name: Allow executor to start only the dedicated deployment unit
  ansible.builtin.copy:
    dest: /etc/sudoers.d/gway-remote-mcp-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      # One precise action: no shell, editor, systemctl flags or other units.
      gway-exec ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block gway-remote-deploy.service

- name: Reload systemd after changing dedicated deploy unit
  ansible.builtin.systemd:
    daemon_reload: true
  when: gway_mcp_deploy_unit.changed
