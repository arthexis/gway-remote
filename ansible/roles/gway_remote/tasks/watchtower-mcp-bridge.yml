---
# Bridge credentials are generated on Watchtower, never stored in Git or logs.
- name: Validate bridge opt-in
  ansible.builtin.assert:
    that:
      - gway_mcp_bridge_enable | default(false) | type_debug == 'bool'

- name: Prepare persistent bridge credential directory
  ansible.builtin.file:
    path: /etc/gway-mcp/bridge
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check existing bridge key
  ansible.builtin.stat:
    path: /etc/gway-mcp/bridge/key
    follow: false
  register: bridge_key

- name: Reject unsafe existing bridge key
  ansible.builtin.assert:
    that:
      - bridge_key.stat.isreg | default(false)
      - bridge_key.stat.pw_name == 'root'
      - bridge_key.stat.mode == '0600'
    fail_msg: Existing bridge key must be a root-owned regular 0600 file
  when: bridge_key.stat.exists

- name: Generate private bridge key once
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os
        fd = os.open('/etc/gway-mcp/bridge/key', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        with os.fdopen(fd, 'wb') as out:
            out.write(os.urandom(32))
  when: not bridge_key.stat.exists
  no_log: true

- name: Install root-only bridge environment
  ansible.builtin.copy:
    dest: /etc/gway-mcp/bridge/gateway.env
    owner: root
    group: root
    mode: "0600"
    content: |
      GWAY_MCP_BRIDGE_ENABLED={{ '1' if gway_mcp_bridge_enable | default(false) | bool else '0' }}
      GWAY_MCP_BRIDGE_KEY_FILE=/etc/gway-mcp/bridge/key
      GWAY_MCP_BRIDGE_SOCKET=/run/gway-mcp-bridge/bridge.sock

- name: Prepare bridge socket directory
  ansible.builtin.file:
    path: /run/gway-mcp-bridge
    state: directory
    owner: root
    group: root
    mode: "0700"
