---
- name: Create protected independent MCP monitoring state directory
  become: true
  ansible.builtin.file:
    path: /var/lib/gway-mcp-monitor
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect the system libexec directory
  become: true
  ansible.builtin.stat:
    path: /usr/local/libexec
    follow: false
  register: mcp_monitor_libexec

- name: Reject an unsafe existing system libexec directory
  ansible.builtin.assert:
    that:
      - mcp_monitor_libexec.stat.isdir | default(false)
      - not (mcp_monitor_libexec.stat.islnk | default(false))
      - mcp_monitor_libexec.stat.uid == 0
      - mcp_monitor_libexec.stat.mode in ['0700', '0750', '0755']
  when: mcp_monitor_libexec.stat.exists

- name: Create missing system libexec directory for the independent monitor
  become: true
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: not mcp_monitor_libexec.stat.exists

- name: Install independent MCP monitoring script
  become: true
  ansible.builtin.copy:
    src: "{{ mcp_source }}/scripts/mcp-health-monitor.py"
    dest: /usr/local/libexec/gway-mcp-health-monitor
    owner: root
    group: root
    mode: '0755'

- name: Install MCP monitor service and timer
  become: true
  ansible.builtin.copy:
    src: "{{ mcp_source }}/deploy/mcp-bearer/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - gway-mcp-health-monitor.service
    - gway-mcp-health-monitor.timer
  register: mcp_monitor_units

- name: Reload systemd for MCP monitor
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: mcp_monitor_units.changed

- name: Enable the independent MCP monitor timer
  become: true
  ansible.builtin.systemd:
    name: gway-mcp-health-monitor.timer
    enabled: true
    state: started
