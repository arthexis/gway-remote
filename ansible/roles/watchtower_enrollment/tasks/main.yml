---
- name: Require deliberate Watchtower staging authorization
  ansible.builtin.assert:
    that:
      - watchtower_enrollment_apply | bool
      - watchtower_enrollment_wireguard_endpoint | length > 0
      - watchtower_enrollment_public_url == 'https://register.gelectriic.com'
    fail_msg: >-
      This role is Watchtower-only and stages no service until explicitly
      enabled with an approved WireGuard UDP endpoint. It must not target gway-001.

- name: Create root-owned Watchtower application and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ watchtower_enrollment_install_root }}"
    - "{{ watchtower_enrollment_state_root }}"
    - "{{ watchtower_enrollment_state_root }}/backups"

- name: Install gway-remote Watchtower source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../gway_remote/"
    dest: "{{ watchtower_enrollment_install_root }}/gway_remote/"
    owner: root
    group: root
    mode: preserve

- name: Install dedicated Watchtower entrypoint
  ansible.builtin.template:
    src: gway-remote-watchtower.j2
    dest: /usr/local/sbin/gway-remote-watchtower
    owner: root
    group: root
    mode: "0755"

- name: Install staged loopback-only Watchtower unit
  ansible.builtin.template:
    src: gway-remote-watchtower-enroll.service.j2
    dest: /etc/systemd/system/gway-remote-watchtower-enroll.service
    owner: root
    group: root
    mode: "0644"
  register: watchtower_unit

- name: Install token-safe Nginx logging format
  ansible.builtin.copy:
    src: gway-remote-watchtower-log.conf
    dest: /etc/nginx/conf.d/gway-remote-watchtower-log.conf
    owner: root
    group: root
    mode: "0644"

- name: Install exact enrollment route fragment for reviewed cutover
  ansible.builtin.copy:
    src: register.gelectriic.com.enrollment.conf
    dest: /etc/nginx/snippets/gway-remote-watchtower-enrollment.conf
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd metadata only
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: watchtower_unit.changed

- name: Keep Watchtower service disabled until approved cutover
  ansible.builtin.systemd_service:
    name: gway-remote-watchtower-enroll.service
    enabled: "{{ watchtower_enrollment_activate | bool }}"
    state: "{{ 'started' if watchtower_enrollment_activate | bool else 'stopped' }}"
