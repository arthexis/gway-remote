# Include only inside the existing register.gelectriic.com TLS server block.
# This exact route is staged for operator-reviewed cutover; it exposes no admin API.
location = /v1/enroll {
    access_log /var/log/nginx/gway-remote-watchtower-enroll.access.log gway_enrollment_safe;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
