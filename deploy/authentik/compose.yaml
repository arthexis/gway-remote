# M2.1 reference only: NOT installed by gway-remote deploy.
# Intended for Watchtower after read-only audit and separate operator approval.
# Versions fixed at reviewed release; refresh with a separate PR after audit.
name: gwa-auth
services:
  postgresql:
    image: docker.io/library/postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS:?Set PG_PASS in protected environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
  server:
    image: ghcr.io/goauthentik/server:2026.8.5
    restart: unless-stopped
    command: server
    environment: &authentik_env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?Set PG_PASS}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - media:/media
      - templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
    networks: [internal]
  worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    restart: unless-stopped
    command: worker
    environment: *authentik_env
    volumes:
      - media:/media
      - templates:/templates
      - certs:/certs
    depends_on:
      postgresql:
        condition: service_healthy
    networks: [internal]
    # No Docker socket: outposts are not used for GWA OAuth.
networks:
  internal:
    internal: false
volumes:
  database:
  media:
  templates:
  certs:
