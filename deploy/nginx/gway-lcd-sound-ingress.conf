# Optional LCD/Sound event ingress. MANUAL STAGING ONLY, never included by default.
# Include only inside the existing HTTPS server block for remote.arthexis.com,
# after verifying the live reverse proxy and the Watchtower gateway service.
# No new listen socket, hostname, WireGuard peer, or TLS certificate.
location = /v1/lcd-sound/event {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:19010/v1/lcd-sound/event;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
}
