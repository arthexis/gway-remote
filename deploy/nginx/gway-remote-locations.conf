# Include ONLY inside the existing TLS server block for remote.arthexis.com.
# Preserve existing vhosts, TLS settings, and certificate renewal.
# Trailing slash strips the node prefix and preserves the Android /api/v1 contract.
location = /api/v1/nodes/gway-001/health {
    proxy_pass http://10.90.0.2:8765/api/v1/health;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
location = /api/v1/nodes/gway-001/commands {
    proxy_pass http://10.90.0.2:8765/api/v1/commands;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
location = /api/v1/nodes/gway-001/github-health {
    limit_except GET { deny all; }
    proxy_pass http://10.90.0.2:8765/api/v1/github-health;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
location = /api/v1/nodes/gway-001/execute {
    limit_except POST { deny all; }
    proxy_pass http://10.90.0.2:8765/api/v1/execute;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}
# Backward-compatible Android paths, valid only on this dedicated hostname.
location = /api/v1/health {
    proxy_pass http://10.90.0.2:8765/api/v1/health;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
location = /api/v1/commands {
    proxy_pass http://10.90.0.2:8765/api/v1/commands;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
location = /api/v1/github-health {
    limit_except GET { deny all; }
    proxy_pass http://10.90.0.2:8765/api/v1/github-health;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
location = /api/v1/execute {
    limit_except POST { deny all; }
    proxy_pass http://10.90.0.2:8765/api/v1/execute;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}

# Read-only official Odoo quotation PDF. Fixed numeric ID path; no arbitrary files.
# Keep the mobile bearer header on the private WireGuard hop.
location ~ ^/api/v1/odoo/quotations/[1-9][0-9]{0,9}/pdf$ {
    limit_except GET { deny all; }
    proxy_pass http://10.90.0.2:8765;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
